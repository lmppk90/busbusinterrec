                        } else setApiError(`找不到路線 ${routeNumber}`);
                    } else if (company === 'NLB') {
                        const response = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list`);
                        const data = await response.json();
                        if (data && data.routes) {
                            const filteredRoutes = data.routes.filter(r => r.routeNo.toUpperCase() === routeNumber.toUpperCase());
                            if (filteredRoutes.length > 0) {
                                const nlbVariants = filteredRoutes.map(r => ({ company: 'NLB', route: r.routeNo, routeId: r.routeId, description: r.routeName_c, subDescription: r.routeName_e, tag: '嶼巴' }));
                                setVariants(nlbVariants); setShowVariantSelector(true);
                            } else setApiError(`找不到路線 ${routeNumber}`);
                        } else setApiError("API 連線錯誤");
                    }
                } catch (err) { setApiError("API 連線錯誤"); } finally { setIsLoading(false); }
            };

            const selectVariant = async (variant) => {
                setIsLoading(true); setShowVariantSelector(false); setApiError(null); setRouteStops([]); setActiveVariant(variant); 
                try {
                    let fullStopsData = [];
                    if (variant.company === 'KMB') {
                        const stopListRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${variant.route}/${variant.bound === 'O' ? 'outbound' : 'inbound'}/${variant.serviceType}`);
                        const stopListData = await stopListRes.json();
                        if (!stopListData.data || stopListData.data.length === 0) throw new Error("無站點資料");
                        fullStopsData = await Promise.all(stopListData.data.map(async (s) => {
                            try { const detailRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`); const detailData = await detailRes.json(); return { seq: s.seq, id: s.stop, name: detailData.data.name_tc }; } 
                            catch { return { seq: s.seq, id: s.stop, name: "未知站點" }; }
                        }));
                        fullStopsData.sort((a, b) => parseInt(a.seq) - parseInt(b.seq));
                    } else if (variant.company === 'CTB') {
                        const stopListRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${variant.route}/${variant.dir}`);
                        const stopListData = await stopListRes.json();
                        if (!stopListData.data || stopListData.data.length === 0) throw new Error("無站點資料");
                        fullStopsData = await Promise.all(stopListData.data.map(async (s) => {
                            try { const detailRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`); const detailData = await detailRes.json(); return { seq: s.seq, id: s.stop, name: detailData.data.name_tc }; } 
                            catch { return { seq: s.seq, id: s.stop, name: "未知站點" }; }
                        }));
                        fullStopsData.sort((a, b) => parseInt(a.seq) - parseInt(b.seq));
                    } else if (variant.company === 'NLB') {
                        const stopListRes = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list&routeId=${variant.routeId}`);
                        const stopListData = await stopListRes.json();
                        if (!stopListData.stops || stopListData.stops.length === 0) throw new Error("無站點資料");
                        fullStopsData = stopListData.stops.map((s, index) => ({ seq: index + 1, id: s.stopId, name: s.stopName_c }));
                    }
                    setRouteStops(fullStopsData);
                    if (fullStopsData.length === 0 && history.length === 0) resetCounter();
                    else { setCurrentStopIndex(0); setStopOn(0); setStopOff(0); setArrivalTime(''); setCurrentNote(''); }
                    setShowTripSettings(true); 
                } catch (err) { setApiError(err.message || "加載站點失敗"); } finally { setIsLoading(false); }
            };

            const handleOcrUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setIsOcrLoading(true); setOcrMessage('');
                try {
                    const text = await performOCR(file);
                    if (text) {
                        setTripInfo({ ...tripInfo, plate: text });
                        setOcrMessage('✅ OCR 辨識成功！');
                    } else {
                        setOcrMessage('❌ 未能辨識，請手動輸入');
                    }
                } catch (err) {
                    setOcrMessage('❌ OCR 系統發生錯誤');
                }
                setTimeout(() => setOcrMessage(''), 4000);
                setIsOcrLoading(false);
                e.target.value = null;
            };

            const resetCounter = () => {
                setCurrentStopIndex(0); setInitialPassengers(0); setTotalPassengers(0); setStopOn(0); setStopOff(0); setArrivalTime('');
                setHistory([]); setTripRecorded(false); setCurrentNote(''); 
            };
            const openResetConfirm = () => setShowResetConfirm(true);
            const performHardReset = () => {
                resetCounter(); setRouteStops([]); setRouteNumber(''); setVariants([]); setTripInfo({ plate: '', captainId: '', captainName: '', comment: '' });
                setActiveVariant(null); setApiError(null); setShowReport(false); setShowResetConfirm(false); localStorage.removeItem('busCounterCurrentSession');
            };
            
            const handleFinishAndReset = () => { 
                copyReport(); 
                saveTripToStats(); 
                if (autoSyncRecord && tripInfo.plate) {
                    const cName = company === 'NLB' ? '新大嶼山巴士' : company === 'KMB' ? '九巴' : company === 'CTB' ? '城巴' : company;
                    onAutoSaveRecord({ company: cName, route: routeNumber, plate: tripInfo.plate, comment: tripInfo.comment });
                }
                performHardReset(); 
            };
            
            const setArrivalNow = () => setArrivalTime(formatTime24());
            
            const jumpToStop = (index) => { 
                setCurrentStopIndex(index); 
                setStopOn(0); 
                setStopOff(0); 
                setArrivalTime(''); 
                setShowStopSelector(false); 
                setCurrentNote(''); 
            };

            const openHistoryEdit = (index) => {
                const record = history[index];
                if (record.isSeparator) return; 
                setHistoryEditValues({ on: record.on, off: record.off, note: record.note || '', time: record.arrivalTime === '-' ? '' : record.arrivalTime });
                setEditingHistoryIndex(index);
            };
            const saveHistoryEdit = () => {
                if (editingHistoryIndex === null) return;
                const updatedHistory = [...history];
                updatedHistory[editingHistoryIndex] = { ...updatedHistory[editingHistoryIndex], on: parseInt(historyEditValues.on) || 0, off: parseInt(historyEditValues.off) || 0, note: historyEditValues.note, arrivalTime: historyEditValues.time || '-' };
                recalculateAll(initialPassengers, updatedHistory); setEditingHistoryIndex(null);
            };

            const handleNextStop = () => {
                if (routeStops.length > 0 && currentStopIndex === routeStops.length - 1) saveTripToStats();
                if (routeStops.length > 0 && currentStopIndex >= routeStops.length) return;
                const currentStopName = routeStops.length > 0 ? routeStops[currentStopIndex]?.name : `第 ${currentStopIndex + 1} 站`;
                setHistory([...history, { stopNumber: currentStopIndex + 1, stopName: currentStopName, arrivalTime: arrivalTime || '-', on: stopOn, off: stopOff, occupancy: totalPassengers, timestamp: formatTime24(), note: currentNote }]);
                setCurrentStopIndex(prev => prev + 1); setStopOn(0); setStopOff(0); setArrivalTime(''); setCurrentNote(''); 
            };
            
            const handleCompleteAndShowReport = () => {
                saveTripToStats();
                const currentStopName = routeStops.length > 0 ? routeStops[currentStopIndex]?.name : `第 ${currentStopIndex + 1} 站`;
                setHistory([...history, { stopNumber: currentStopIndex + 1, stopName: currentStopName, arrivalTime: arrivalTime || '-', on: stopOn, off: stopOff, occupancy: totalPassengers, timestamp: formatTime24(), note: currentNote }]);
                setCurrentStopIndex(routeStops.length); // 直接跳到最後
                setStopOn(0); setStopOff(0); setArrivalTime(''); setCurrentNote('');
                setShowStopSelector(false);
                setShowReport(true);
            };
            
            const handleShowReport = () => {
                setShowReport(true);
            };

            const handlePrevStop = () => {
                if (currentStopIndex === 0) return;
                const newHistory = [...history]; let lastRecord = newHistory.pop();
                if (lastRecord && lastRecord.isSeparator && newHistory.length > 0) lastRecord = newHistory.pop();
                setCurrentStopIndex(prev => prev - 1);
                let targetOn = 0, targetOff = 0;
                if (lastRecord && !lastRecord.isSeparator) {
                    targetOn = lastRecord.on || 0; targetOff = lastRecord.off || 0;
                    setStopOn(targetOn); setStopOff(targetOff); setArrivalTime(lastRecord.arrivalTime === '-' ? '' : lastRecord.arrivalTime); setCurrentNote(lastRecord.note || '');
                } else { setStopOn(0); setStopOff(0); setArrivalTime(''); setCurrentNote(''); }
                setHistory(newHistory); recalculateAll(initialPassengers, newHistory, targetOn, targetOff);
            };

            const incrementOn = () => { setStopOn(s => s + 1); setTotalPassengers(t => t + 1); };
            const decrementOn = () => { if (stopOn > 0) { setStopOn(s => s - 1); setTotalPassengers(t => t - 1); }};
            const incrementOff = () => { setStopOff(s => s + 1); setTotalPassengers(t => t - 1); };
            const decrementOff = () => { if (stopOff > 0) { setStopOff(s => s - 1); setTotalPassengers(t => t + 1); }};

            // 新增：處理手動輸入上車人數
            const handleStopOnChange = (e) => {
                const valStr = e.target.value;
                if (valStr === '') {
                    setTotalPassengers(t => t - stopOn);
                    setStopOn(0);
                    return;
                }
                const val = parseInt(valStr, 10);
                if (!isNaN(val) && val >= 0) {
                    setTotalPassengers(t => t - stopOn + val);
                    setStopOn(val);
                }
            };

            // 新增：處理手動輸入落車人數
            const handleStopOffChange = (e) => {
                const valStr = e.target.value;
                if (valStr === '') {
                    setTotalPassengers(t => t + stopOff);
                    setStopOff(0);
                    return;
                }
                const val = parseInt(valStr, 10);
                if (!isNaN(val) && val >= 0) {
                    setTotalPassengers(t => t + stopOff - val);
                    setStopOff(val);
                }
            };

            // 處理手動校準人數
            const handleManualInputSubmit = () => {
                const val = parseInt(manualInputValue);
                if (isNaN(val)) return;
                if (manualInputMode === 'base') {
                    recalculateAll(val, history, stopOn, stopOff);
                } else if (manualInputMode === 'current') {
                    const diff = val - totalPassengers;
                    if (diff > 0) {
                        setStopOn(prev => prev + diff);
                    } else if (diff < 0) {
                        setStopOff(prev => prev - diff);
                    }
                    setTotalPassengers(val);
                }
                setShowManualInput(false);
            };

            const getTripDuration = () => {
                if (history.length === 0) return 0;
                const start = history[0].arrivalTime; let end = arrivalTime;
                for (let i = history.length - 1; i >= 0; i--) { if (!history[i].isSeparator && history[i].arrivalTime !== '-') { if (!end) end = history[i].arrivalTime; break; } }
                if (arrivalTime && currentStopIndex < routeStops.length) end = arrivalTime; 
                return calculateDurationMinutes(start, end);
            };
            const formatDuration = (mins) => durationFormat === 'min' ? `${mins} 分鐘` : (Math.floor(mins / 60) > 0 ? `${Math.floor(mins / 60)}小時${mins % 60}分鐘` : `${mins % 60}分鐘`);
            const getTotalPatronage = () => { let total = initialPassengers; history.forEach(r => { if(!r.isSeparator) total += r.on; }); if (routeStops.length === 0 || currentStopIndex < routeStops.length) total += stopOn; return total; };

            const copyReport = () => {
                if (currentStopIndex >= routeStops.length - 1) saveTripToStats();
                const analysisData = getAnalysisData();
                let text = `巴士客量統計報告\n================================\n日期: ${new Date().toLocaleDateString()}\n路線: ${company} ${routeNumber || '-'}\n車牌/車隊編號: ${tripInfo.plate || '-'}\n車長: ${tripInfo.captainId || '-'} ${tripInfo.captainName || ''}\n總行車時間: ${formatDuration(getTripDuration())}\n初始: ${initialPassengers} 人\n\n`;
                if (includeAnalysis && analysisData && (analysisData.maxOnVal > 0 || analysisData.maxOccVal > 0)) {
                    text += `*** 重點客量分析 ***\n`;
                    if (analysisData.maxOnStops.length > 0) text += `🔥 最多人上車: ${analysisData.maxOnStops.map(s => cleanStopName(s.stopName)).join(", ")} (+${analysisData.maxOnVal})\n`;
                    if (analysisData.maxOffStops.length > 0) text += `📉 最多人落車: ${analysisData.maxOffStops.map(s => cleanStopName(s.stopName)).join(", ")} (-${analysisData.maxOffVal})\n`;
                    if (analysisData.formattedSegments.length > 0) text += `🚌 最高載客路段: ${analysisData.formattedSegments.join(", ")} (${analysisData.maxOccVal})\n`;
                    text += `\n`;
                }
                text += `時間   | 站名           | 上  | 落  | 車上${includeNotesInReport ? ' | 備註' : ''}\n`;
                text += includeNotesInReport ? `----------------------------------------------------\n` : `---------------------------------------------\n`;
                history.forEach(record => {
                    if (record.isSeparator) { text += `--- 繼續行程 / 轉頁 ---\n`; return; }
                    let line = `${(record.arrivalTime === '-' ? '--:--' : record.arrivalTime).padEnd(6)} | ${cleanStopName(record.stopName).padEnd(12)} | +${record.on.toString().padEnd(2)} | -${record.off.toString().padEnd(2)} | ${record.occupancy < 0 ? `(${record.occupancy})` : record.occupancy}`;
                    if (includeNotesInReport) line += ` | ${record.note || ''}`;
                    text += line + `\n`;
                });
                if (routeStops.length === 0 || currentStopIndex < routeStops.length) {
                    if (stopOn > 0 || stopOff > 0 || arrivalTime || currentNote) {
                        let line = `${(arrivalTime || '--:--').padEnd(6)} | ${cleanStopName(routeStops.length > 0 ? routeStops[currentStopIndex]?.name : `第 ${currentStopIndex + 1} 站`).padEnd(12)} | +${stopOn.toString().padEnd(2)} | -${stopOff.toString().padEnd(2)} | ${totalPassengers < 0 ? `(${totalPassengers})` : totalPassengers}`;
                        if (includeNotesInReport) line += ` | ${currentNote || ''}`;
                        text += line + `\n`;
                    }
                }
                if (showTotalPatronage) text += `\n總客量: ${getTotalPatronage()}\n`;
                text += `由 BusCounter 生成`;
                
                if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); }).catch(() => { }); } 
                else {
                     const textArea = document.createElement("textarea"); textArea.value = text; document.body.appendChild(textArea); textArea.select();
                     try { document.execCommand('copy'); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (err) {} document.body.removeChild(textArea);
                }
            };

            const getCurrentStopDisplay = () => routeStops.length > 0 ? (currentStopIndex < routeStops.length ? routeStops[currentStopIndex].name : "行程結束 (End)") : `第 ${currentStopIndex + 1} 站`;
            const getNextStopDisplay = () => routeStops.length > 0 ? (currentStopIndex < routeStops.length - 1 ? `下一站: ${routeStops[currentStopIndex + 1].name}` : currentStopIndex === routeStops.length - 1 ? "總站 (記錄並結束)" : "行程已結束") : "前往下一站";
            const getPrevStopDisplay = () => (currentStopIndex > 0 && routeStops.length > 0) ? `上一站: ${routeStops[currentStopIndex - 1].name}` : "上一站: 起點";
            const isLastStop = routeStops.length > 0 && currentStopIndex === routeStops.length - 1;

            if (showReport) {
                const analysisData = getAnalysisData(); const totalPatronage = getTotalPatronage();
                return (
                    <div className="flex flex-col h-screen bg-gray-50 font-sans text-gray-900 relative">
                        {editingHistoryIndex !== null && (
                            <div className="absolute inset-0 z-[70] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                                <div className="bg-white rounded-xl p-5 w-full max-w-xs shadow-2xl">
                                    <h3 className="text-lg font-bold mb-2 text-slate-700 flex items-center gap-2"><Pencil className="w-5 h-5"/> 修正記錄</h3>
                                    <div className="grid grid-cols-2 gap-4 mb-4">
                                        <div><label className="text-xs font-bold text-green-600 uppercase block mb-1">上車</label><input type="number" value={historyEditValues.on} onChange={(e) => setHistoryEditValues({...historyEditValues, on: e.target.value})} className="w-full border-2 border-green-100 rounded-lg p-2 text-xl font-bold text-center focus:border-green-500 outline-none" /></div>
                                        <div><label className="text-xs font-bold text-red-500 uppercase block mb-1">落車</label><input type="number" value={historyEditValues.off} onChange={(e) => setHistoryEditValues({...historyEditValues, off: e.target.value})} className="w-full border-2 border-red-100 rounded-lg p-2 text-xl font-bold text-center focus:border-red-500 outline-none" /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3"><button onClick={() => setEditingHistoryIndex(null)} className="py-2 bg-gray-100 rounded-lg font-bold text-gray-600">取消</button><button onClick={saveHistoryEdit} className="py-2 bg-blue-600 text-white rounded-lg font-bold shadow-sm">確認修正</button></div>
                                </div>
                            </div>
                        )}
                        <header className="bg-white border-b p-4 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                            <h2 className="text-xl font-bold flex items-center gap-2"><FileText className="w-6 h-6 text-blue-600" /> 統計報告</h2>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowTotalPatronage(!showTotalPatronage)} className={`flex items-center gap-1 text-xs font-bold px-2 py-1.5 rounded border transition-colors ${showTotalPatronage ? 'bg-green-50 text-green-700 border-green-200' : 'bg-gray-50 text-gray-400 border-gray-200'}`}><UserPlus className="w-3 h-3"/> {showTotalPatronage ? '總客量' : '隱藏'}</button>
                                <button onClick={() => setIncludeAnalysis(!includeAnalysis)} className={`flex items-center gap-1 text-xs font-bold px-2 py-1.5 rounded border transition-colors ${includeAnalysis ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-gray-50 text-gray-400 border-gray-200'}`}><Lightbulb className="w-3 h-3"/> {includeAnalysis ? '分析' : '隱藏'}</button>
                                <button onClick={() => setShowReport(false)} className="text-blue-600 font-medium ml-1">返回</button>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4">
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-4">
                                <div className="p-4 bg-slate-50 border-b grid grid-cols-2 gap-y-3 text-sm">
                                    <div><span className="text-slate-400 block text-[10px] uppercase font-bold">路線</span><span className="font-bold text-lg">{company} {routeNumber}</span></div>
                                    <div className="text-right"><span className="text-slate-400 block text-[10px] uppercase font-bold">日期</span><span className="font-bold">{new Date().toLocaleDateString()}</span></div>
                                </div>
                                {/* 分析資料 */}
                                {includeAnalysis && analysisData && (analysisData.maxOnVal > 0 || analysisData.maxOccVal > 0) && (
                                    <div className="bg-purple-50 border-b border-purple-100 p-3">
                                        <h3 className="text-purple-800 text-xs font-bold uppercase mb-2 flex items-center gap-1"><TrendingUp className="w-3 h-3"/> 重點客量分析</h3>
                                        {analysisData.maxOnStops.length > 0 && <div className="flex justify-between items-start text-sm"><span className="text-gray-500 text-xs font-bold">最多人上車</span><div className="text-right font-bold text-purple-700">{analysisData.maxOnStops.map(s => cleanStopName(s.stopName)).join(", ")}</div></div>}
                                        {analysisData.maxOffStops.length > 0 && <div className="flex justify-between items-start text-sm"><span className="text-gray-500 text-xs font-bold">最多人落車</span><div className="text-right font-bold text-purple-700">{analysisData.maxOffStops.map(s => cleanStopName(s.stopName)).join(", ")}</div></div>}
                                    </div>
                                )}
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-white border-b"><tr><th className="p-2 text-left text-blue-600 text-xs w-12 font-bold whitespace-nowrap">時間</th><th className="p-2 text-left text-gray-500 text-xs font-bold whitespace-nowrap">站名</th><th className="p-2 text-center text-green-600 text-xs w-8 font-bold whitespace-nowrap">上</th><th className="p-2 text-center text-red-600 text-xs w-8 font-bold whitespace-nowrap">落</th><th className="p-2 text-right text-gray-800 text-xs w-10 font-bold whitespace-nowrap">車上</th><th className="p-2 w-8"></th></tr></thead>
                                        <tbody className="divide-y divide-gray-100 bg-white">
                                            {history.map((record, idx) => {
                                                if (record.isSeparator) return <tr key={idx} className="bg-gray-100"><td colSpan={6} className="p-2 text-center text-xs font-bold text-slate-500 uppercase">--- 繼續行程 / 轉頁 ---</td></tr>;
                                                return (
                                                <tr key={idx} className="hover:bg-gray-50 group">
                                                    <td className="p-2 text-left font-mono text-blue-600 font-medium text-xs whitespace-nowrap">{record.arrivalTime !== '-' ? record.arrivalTime : '--:--'}</td>
                                                    <td className="p-2 font-medium text-gray-800 text-xs">{cleanStopName(record.stopName)}</td>
                                                    <td className="p-2 text-center font-bold text-green-600 text-xs">+{record.on}</td>
                                                    <td className="p-2 text-center font-bold text-red-500 text-xs">-{record.off}</td>
                                                    <td className="p-2 text-right font-bold text-gray-900 text-xs">{record.occupancy < 0 ? `(${record.occupancy})` : record.occupancy}</td>
                                                    <td className="p-2 text-right"><button onClick={() => openHistoryEdit(idx)} className="text-gray-300 hover:text-blue-600 p-1"><Edit3 className="w-4 h-4" /></button></td>
                                                </tr>
                                            )})}
                                        </tbody>
                                    </table>
                                </div>
                                {showTotalPatronage && <div className="p-4 bg-slate-50 border-t flex justify-between items-center"><span className="text-sm font-bold text-slate-500">總客量</span><span className="text-2xl font-bold text-slate-800">{totalPatronage}</span></div>}
                            </div>
                        </div>
                        
                        {/* 乘車評語區 */}
                        {autoSyncRecord && tripInfo.plate && (
                            <div className="bg-blue-50 border-t border-blue-200 p-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                                <label className="text-sm font-bold text-blue-800 flex items-center gap-2 mb-2">
                                    <MessageSquare className="w-4 h-4" /> 加入評語 (將同步至搭車紀錄)
                                </label>
                                <textarea
                                    rows="2"
                                    placeholder="例如：冷氣好夠凍、車長手車好穩..."
                                    value={tripInfo.comment || ''}
                                    onChange={(e) => setTripInfo({...tripInfo, comment: e.target.value})}
                                    className="w-full border border-blue-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none text-sm shadow-sm"
                                />
                            </div>
                        )}

                        <div className="p-4 bg-white border-t pb-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] space-y-3">
                            <button onClick={copyReport} className={`w-full py-4 rounded-xl text-lg font-bold flex items-center justify-center gap-2 ${copied ? 'bg-green-600 text-white' : 'bg-blue-600 text-white'}`}>{copied ? <><Check className="w-5 h-5"/> 已複製</> : <><Copy className="w-5 h-5"/> 複製報告</>}</button>
                            <button onClick={handleFinishAndReset} className="w-full py-4 rounded-xl text-lg font-bold flex items-center justify-center gap-2 bg-slate-800 text-white border border-slate-700"><CheckCircle2 className="w-5 h-5 text-green-400" /> {autoSyncRecord && tripInfo.plate ? '複製、連動並重置' : '複製並重置'}</button>
                        </div>
                    </div>
                );
            }

            const renderTripSettingsModal = () => {
                if (!showTripSettings) return null;
                return (
                    <div className="absolute inset-0 z-[60] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                        <div className="bg-white rounded-xl p-5 w-full max-w-sm shadow-2xl">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-lg font-bold flex items-center gap-2 text-slate-800"><Settings className="w-5 h-5" /> 行程資料設定</h3>
                                <button onClick={() => setShowTripSettings(false)} className="text-sm text-blue-600 font-bold">關閉</button>
                            </div>
                            <div className="space-y-4 mb-6">
                                <div>
                                    <label className="text-xs font-bold text-gray-500 uppercase mb-1 block">車隊編號/車牌</label>
                                    <input type="file" ref={fileInputRef} hidden accept="image/*" onChange={handleOcrUpload} />
                                    <AutocompleteInput
                                        value={tripInfo.plate || ''}
                                        onChange={(val) => setTripInfo({...tripInfo, plate: val.toUpperCase()})}
                                        options={companyFleets}
                                        placeholder="例如: 8123 或者 SE6"
                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg py-2"
                                        onOcr={() => fileInputRef.current?.click()}
                                        isOcrLoading={isOcrLoading}
                                        ocrMessage={ocrMessage}
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-3 mt-4">
                                    <div><label className="text-xs font-bold text-gray-500 uppercase mb-1 block">車長編號</label><input type="text" className="w-full bg-slate-50 border border-slate-300 rounded-lg py-2 pl-3" value={tripInfo.captainId} onChange={(e) => setTripInfo({...tripInfo, captainId: e.target.value})} /></div>
                                    <div><label className="text-xs font-bold text-gray-500 uppercase mb-1 block">車長姓氏</label><input type="text" className="w-full bg-slate-50 border border-slate-300 rounded-lg py-2 pl-3" value={tripInfo.captainName} onChange={(e) => setTripInfo({...tripInfo, captainName: e.target.value})} /></div>
                                </div>
                                <div className="pt-2 border-t mt-2 flex items-center justify-between">
                                    <label className="text-sm font-bold text-gray-700 flex items-center gap-2"><ClipboardList className="w-4 h-4"/> 結束時自動加入搭車紀錄</label>
                                    <input type="checkbox" checked={autoSyncRecord} onChange={(e) => setAutoSyncRecord(e.target.checked)} className="w-5 h-5 text-blue-600" />
                                </div>
                                {autoSyncRecord && <p className="text-xs text-gray-400">系統會用你輸入嘅車隊編號自動幫你入庫。評語可於生成報告時填寫。</p>}
                            </div>
                            <button onClick={() => setShowTripSettings(false)} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold">確認並儲存</button>
                        </div>
                    </div>
                );
            };

            const renderStopSelectorModal = () => {
                if (!showStopSelector) return null;
                return (
                    <div className="absolute inset-0 z-50 bg-black/60 flex items-end justify-center backdrop-blur-sm animate-in slide-in-from-bottom duration-200">
                        <div className="bg-white w-full h-[80vh] rounded-t-3xl flex flex-col shadow-2xl">
                            <div className="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl sticky top-0 z-10">
                                <h3 className="font-bold text-lg flex items-center gap-2"><MapPin className="text-blue-600"/> 選擇跳轉站點</h3>
                                <button onClick={() => setShowStopSelector(false)} className="bg-gray-200 p-1.5 rounded-full text-gray-600 hover:bg-gray-300"><X size={20}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-2 pb-4">
                                {routeStops.map((stop, idx) => (
                                    <button key={idx} onClick={() => jumpToStop(idx)} className={`w-full text-left p-4 border-b border-gray-100 flex items-center gap-3 active:bg-blue-50 transition-colors ${currentStopIndex === idx ? 'bg-blue-50 text-blue-700 font-bold' : 'text-gray-700 hover:bg-gray-50'}`}>
                                        <span className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shadow-sm ${currentStopIndex === idx ? 'bg-blue-600 text-white' : 'bg-white border text-gray-500'}`}>{idx + 1}</span>
                                        <span className="flex-1">{stop.name}</span>
                                        {currentStopIndex === idx && <Check size={18} className="text-blue-600"/>}
                                    </button>
                                ))}
                            </div>
                            <div className="p-4 border-t bg-white pb-8 shadow-[0_-4px_15px_-3px_rgba(0,0,0,0.1)]">
                                <button onClick={handleCompleteAndShowReport} className="w-full bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold py-4 rounded-xl shadow-md flex justify-center items-center gap-2 transition-colors">
                                    <StopCircle size={20}/> 跳至終點並生成報告
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full bg-slate-100 font-sans text-gray-900 overflow-hidden relative mx-auto shadow-xl">
                    {renderTripSettingsModal()}
                    {renderStopSelectorModal()}
                    
                    {/* 手動校準人數 Modal */}
                    {showManualInput && (
                        <div className="absolute inset-0 z-[80] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden">
                                <div className="flex bg-gray-100 p-1">
                                    <button onClick={() => { setManualInputMode('base'); setManualInputValue(initialPassengers.toString()); }} className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${manualInputMode === 'base' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}>修改初始值</button>
                                    <button onClick={() => { setManualInputMode('current'); setManualInputValue(totalPassengers.toString()); }} className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${manualInputMode === 'current' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}>校準當前人數</button>
                                </div>
                                <div className="p-6 text-center">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4">{manualInputMode === 'base' ? '設定初始人數 (Base)' : '校準當前人數'}</h3>
                                    <input type="number" value={manualInputValue} onChange={e => setManualInputValue(e.target.value)} className="w-full text-center text-5xl font-bold font-mono border-b-4 border-blue-500 focus:outline-none pb-2 mb-6 bg-transparent" autoFocus />
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={() => setShowManualInput(false)} className="py-3 bg-gray-100 text-gray-600 rounded-xl font-bold">取消</button>
                                        <button onClick={handleManualInputSubmit} className="py-3 bg-blue-600 text-white rounded-xl font-bold shadow-md">確認</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Reset 確認 Modal */}
                    {showResetConfirm && (
                        <div className="absolute inset-0 z-[80] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
                                <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><RotateCcw className="w-8 h-8 text-red-600" /></div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">確定要重置嗎？</h3>
                                <p className="text-sm text-gray-500 mb-6">這將會清除當前所有行程紀錄及人數，且無法復原。</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setShowResetConfirm(false)} className="py-3 bg-gray-100 text-gray-700 rounded-xl font-bold">取消</button>
                                    <button onClick={performHardReset} className="py-3 bg-red-600 text-white rounded-xl font-bold shadow-md">確定重置</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <header className="bg-slate-800 text-white p-3 shadow-md flex-none z-20">
                        <div className="flex items-center gap-3 mb-3">
                            <button onClick={onBack} className="p-2 -ml-2 rounded-full hover:bg-slate-700 text-slate-300 transition-colors"><ArrowLeft size={24} /></button>
                            <h1 className="text-xl font-bold flex items-center gap-2"><BusFront size={24} className="text-blue-400"/> 客量統計</h1>
                            
                            <div className="ml-auto flex gap-2">
                                <button onClick={openResetConfirm} className="p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded-full transition-colors"><RotateCcw className="w-5 h-5" /></button>
                                <button onClick={handleShowReport} className="bg-blue-600 hover:bg-blue-500 p-2 rounded-lg text-sm font-medium flex items-center gap-1 shadow-md active:scale-95 transition-transform"><FileText className="w-5 h-5" /></button>
                            </div>
                        </div>

                        <div className="flex justify-between items-start mb-3 gap-2">
                            <div className="flex-1 flex gap-2">
                                <button onClick={toggleCompany} className={`px-2 rounded font-bold text-xs flex items-center justify-center min-w-[50px] border shadow-sm active:scale-95 ${getCompanyColor(company)}`}>{company === 'KMB' ? '九巴' : company === 'CTB' ? '城巴' : '嶼巴'}</button>
                                <input type="text" placeholder="路線 (如 1A)" value={routeNumber} onChange={(e) => setRouteNumber(e.target.value)} className="bg-slate-700 text-white pl-3 pr-2 py-2 rounded w-full text-sm border border-slate-600 focus:outline-none focus:border-blue-400 uppercase font-bold" />
                                <button onClick={searchRoute} disabled={isLoading || !routeNumber} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-3 rounded flex items-center justify-center shadow-md"><Search className="w-5 h-5" /></button>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setShowTripSettings(true)} className="p-2 text-slate-300 hover:text-white bg-slate-700 rounded-lg flex items-center gap-1"><Settings className="w-5 h-5" /> <span className="text-xs font-bold uppercase hidden sm:block">設定</span></button>
                            </div>
                        </div>
                        {showVariantSelector && (
                            <div className="absolute top-28 left-2 right-2 bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 p-0 z-50 max-h-[60vh] overflow-y-auto">
                                <div className="px-4 py-3 bg-slate-50 border-b text-xs font-bold flex justify-between items-center"><span>請選擇路線方向:</span><button onClick={() => setShowVariantSelector(false)} className="text-blue-600">關閉</button></div>
                                {variants.map((v, idx) => (
                                    <button key={idx} onClick={() => selectVariant(v)} className="w-full text-left p-4 border-b last:border-0 hover:bg-blue-50">
                                        <div className="flex items-center gap-3">
                                            <span className={`text-xs px-2 py-1 rounded font-bold shadow-sm ${getCompanyColor(v.company).replace(/border-\w+/, '').replace(/text-\w+/, '')}`.trim()}>{v.route}</span>
                                            <div className="flex-1"><div className="text-sm font-bold">{v.description}</div></div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        )}
                        <div className="bg-slate-700 rounded-xl p-2 flex justify-between items-center border border-slate-600 relative overflow-hidden shadow-inner">
                            <div onClick={() => routeStops.length > 0 && setShowStopSelector(true)} className="flex-1 min-w-0 pr-2 cursor-pointer active:opacity-70 group hover:bg-slate-600 p-1 -m-1 rounded-lg transition-colors">
                                <div className="text-slate-400 text-[10px] mb-0.5 uppercase font-bold flex items-center gap-1 group-hover:text-blue-300 transition-colors">當前站點 (按此跳站) <ChevronDown className="w-3 h-3" /></div>
                                <div className="flex items-center gap-2">
                                    <div className={`min-w-[1.8rem] h-7 rounded flex items-center justify-center font-bold text-sm shadow-sm px-1 ${getCompanyColor(company).replace(/border-\w+/, '').replace(/text-\w+/, '')}`.trim()}>{currentStopIndex + 1}</div>
                                    <span className="text-white font-bold text-lg truncate leading-tight group-hover:text-blue-100">{getCurrentStopDisplay()}</span>
                                </div>
                            </div>
                            
                            {/* 點擊觸發更改數字 Modal */}
                            <div onClick={() => { setManualInputMode('current'); setManualInputValue(totalPassengers.toString()); setShowManualInput(true); }} className="text-right pl-2 border-l border-slate-600 cursor-pointer hover:bg-slate-600 p-1 -my-1 rounded-lg transition-colors group">
                                <div className="text-[10px] text-slate-400 mb-0.5 flex items-center justify-end gap-1 uppercase font-bold group-hover:text-blue-300 transition-colors">車上人數 <Pencil className="w-3 h-3"/></div>
                                <div className={`text-3xl font-mono font-bold leading-none group-hover:text-blue-100 transition-colors ${totalPassengers < 0 ? 'text-red-400' : 'text-white'}`}>{totalPassengers}</div>
                            </div>
                        </div>
                    </header>
                    <main className="flex-1 flex flex-col p-3 gap-3 overflow-hidden relative bg-slate-100">
                        
                        {/* 手動輸入時間及備註列 */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-2 flex gap-2 items-center flex-none">
                            <Clock className="w-5 h-5 text-gray-400 ml-1 shrink-0" />
                            <input type="time" value={arrivalTime} onChange={e => setArrivalTime(e.target.value)} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 text-sm flex-1 font-mono outline-none focus:ring-2 focus:ring-blue-400" />
                            <button onClick={setArrivalNow} className="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-bold active:scale-95 transition-transform shrink-0">現在</button>
                            <div className="w-px h-6 bg-gray-200 mx-1 shrink-0"></div>
                            <button onClick={() => setShowNoteInput(!showNoteInput)} className={`p-1.5 rounded-lg transition-colors shrink-0 ${currentNote || showNoteInput ? 'text-blue-600 bg-blue-50' : 'text-gray-400 hover:bg-gray-100'}`}><StickyNote className="w-5 h-5" /></button>
                        </div>
                        
                        {showNoteInput && (
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-2 animate-in fade-in slide-in-from-top-2 flex-none">
                                <input type="text" placeholder="輸入此站備註 (如: 拖卡/頂閘)..." value={currentNote} onChange={e => setCurrentNote(e.target.value)} className="w-full bg-yellow-50/50 border border-yellow-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" autoFocus />
                            </div>
                        )}

                        <div className="flex-1 grid grid-cols-2 gap-3 min-h-0">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden relative group">
                                <div className="bg-green-50 py-2 flex items-center justify-center gap-1 border-b border-green-100 px-2">
                                    <span className="text-green-700 text-sm font-extrabold uppercase tracking-wide">上車</span>
                                    <Edit3 className="w-3 h-3 text-green-600/50" />
                                </div>
                                <div className="flex-1 flex flex-col items-center justify-center relative">
                                    <button onClick={incrementOn} className="w-full h-full absolute inset-0 active:bg-green-100 transition-colors z-0"></button>
                                    <input 
                                        type="number" 
                                        value={stopOn === 0 ? '' : stopOn} 
                                        onChange={handleStopOnChange}
                                        onFocus={e => e.target.select()}
                                        placeholder="0"
                                        className="relative z-10 w-32 text-center mb-2 text-5xl font-bold text-slate-800 font-mono tracking-tighter bg-transparent focus:outline-none focus:bg-green-50 rounded-lg placeholder-slate-300"
                                    />
                                    <div className="relative z-10 pointer-events-none mb-2"><div className="w-14 h-14 rounded-full bg-green-100 flex items-center justify-center border-2 border-green-200 shadow-sm"><Plus className="w-7 h-7 text-green-600" /></div></div>
                                </div>
                                <button onClick={decrementOn} disabled={stopOn === 0} className="absolute bottom-3 left-3 w-10 h-10 rounded-full bg-slate-100 text-slate-400 hover:text-red-500 flex items-center justify-center z-10"><Minus className="w-5 h-5" /></button>
                            </div>
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden relative group">
                                <div className="bg-red-50 py-2 flex items-center justify-center gap-1 border-b border-red-100">
                                    <span className="text-red-700 text-sm font-extrabold uppercase tracking-wide">落車</span>
                                    <Edit3 className="w-3 h-3 text-red-600/50" />
                                </div>
                                <div className="flex-1 flex flex-col items-center justify-center relative">
                                    <button onClick={incrementOff} className="w-full h-full absolute inset-0 active:bg-red-100 transition-colors z-0"></button>
                                    <input 
                                        type="number" 
                                        value={stopOff === 0 ? '' : stopOff} 
                                        onChange={handleStopOffChange}
                                        onFocus={e => e.target.select()}
                                        placeholder="0"
                                        className="relative z-10 w-32 text-center mb-2 text-5xl font-bold text-slate-800 font-mono tracking-tighter bg-transparent focus:outline-none focus:bg-red-50 rounded-lg placeholder-slate-300"
                                    />
                                    <div className="relative z-10 pointer-events-none mb-2"><div className="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center border-2 border-red-200 shadow-sm"><Minus className="w-7 h-7 text-red-600" /></div></div>
                                </div>
                                <button onClick={decrementOff} disabled={stopOff === 0} className="absolute bottom-3 right-3 w-10 h-10 rounded-full bg-slate-100 text-slate-400 hover:text-green-500 flex items-center justify-center z-10"><Minus className="w-5 h-5" /></button>
                            </div>
                        </div>
                        
                        <div className="flex-none pt-1 pb-1">
                            <div className="flex flex-col gap-2">
                                <div className="flex gap-2 h-14">
                                    <button onClick={handlePrevStop} disabled={currentStopIndex === 0} className="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-xl shadow flex flex-col items-center justify-center disabled:opacity-50 active:scale-95 transition-transform">
                                        <div className="text-[9px] font-bold uppercase tracking-wider mb-0.5 text-slate-400">Prev</div>
                                        <div className="text-sm font-bold flex items-center gap-1"><ChevronLeft className="w-4 h-4" /> 上一站</div>
                                    </button>
                                    <button onClick={handleShowReport} className="w-1/3 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-xl shadow flex flex-col items-center justify-center active:scale-95 transition-transform">
                                        <div className="text-[9px] font-bold uppercase tracking-wider mb-0.5 text-blue-400">Preview</div>
                                        <div className="text-sm font-bold flex items-center gap-1"><FileText className="w-4 h-4" /> 預覽</div>
                                    </button>
                                    <button onClick={handleCompleteAndShowReport} disabled={routeStops.length === 0} className="w-1/3 bg-red-100 hover:bg-red-200 text-red-700 rounded-xl shadow flex flex-col items-center justify-center disabled:opacity-50 active:scale-95 transition-transform">
                                        <div className="text-[9px] font-bold uppercase tracking-wider mb-0.5 text-red-400">End</div>
                                        <div className="text-sm font-bold flex items-center gap-1"><StopCircle className="w-4 h-4" /> 提早結束</div>
                                    </button>
                                </div>
                                
                                <button onClick={isLastStop ? handleCompleteAndShowReport : handleNextStop} className="w-full h-14 bg-slate-800 text-white rounded-xl shadow-lg flex flex-col items-center justify-center px-4 active:scale-[0.98] transition-transform">
                                    <div className="text-[9px] font-bold uppercase tracking-wider mb-0.5 text-slate-400">{isLastStop ? 'End Trip' : 'Next Action'}</div>
                                    <div className="text-xl font-bold text-yellow-400 flex items-center gap-1">
                                        {isLastStop ? '完成並結束' : getNextStopDisplay()} <ChevronRight className="w-5 h-5" />
                                    </div>
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // ==========================================
        // 主選單 (Landing Page) - 全新設計還原截圖
        // ==========================================
        function MainMenu({ onSelect, records, statsData }) {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const thisMonthPrefix = `${yyyy}-${mm}`;
            const thisMonthRides = records.filter(r => r.date && r.date.startsWith(thisMonthPrefix)).length;
            const safeStatsData = statsData || { monthly: { total: 0 } };
            const thisMonthTrips = safeStatsData.monthly?.total || 0;

            return (
                <div className="h-full w-full max-w-md mx-auto flex flex-col font-sans relative overflow-y-auto overflow-x-hidden pb-10 shadow-2xl bg-gradient-to-br from-[#E1F0FF] via-[#FAFAFA] to-[#FFF3E1]">
                    
                    <div className="z-10 w-full text-center pt-20 pb-10">
                        <div className="inline-flex items-center justify-center w-[72px] h-[72px] bg-white rounded-2xl mb-6 text-blue-600 shadow-[0_8px_30px_rgb(0,0,0,0.06)]">
                            <BusFront size={36} strokeWidth={2.5} />
                        </div>
                        <h1 className="text-[28px] font-extrabold text-[#1c2331] tracking-tight mb-2">公共交通工具包</h1>
                        <p className="text-sm font-medium text-slate-500">請選擇你要使用的工具</p>
                    </div>

                    <div className="px-5 space-y-4">
                        <button onClick={() => onSelect('app1')} className="w-full text-left bg-white/90 backdrop-blur rounded-3xl p-6 shadow-[0_4px_20px_rgb(0,0,0,0.04)] hover:shadow-md hover:-translate-y-1 transition-all active:scale-[0.98] flex items-center gap-5 border border-white/40">
                            <div className="bg-[#FFF8E6] text-[#D4A017] p-3.5 rounded-2xl flex-shrink-0">
                                <MessageSquare size={26} strokeWidth={2} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800 mb-1">搭車紀錄</h3>
                                <p className="text-xs text-slate-500 leading-relaxed">記錄個人乘車體驗、車型、車隊編號及冷氣等評語，建立私人搭車資料庫。</p>
                            </div>
                        </button>
                        
                        <button onClick={() => onSelect('app2')} className="w-full text-left bg-white/90 backdrop-blur rounded-3xl p-6 shadow-[0_4px_20px_rgb(0,0,0,0.04)] hover:shadow-md hover:-translate-y-1 transition-all active:scale-[0.98] flex items-center gap-5 border border-white/40">
                            <div className="bg-[#EBF3FF] text-[#4285F4] p-3.5 rounded-2xl flex-shrink-0">
                                <Users size={26} strokeWidth={2} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800 mb-1">客量統計</h3>
                                <p className="text-xs text-slate-500 leading-relaxed">即時統計每站上下車人數，分析高低客量路段並匯出 Excel 詳細報告。</p>
                            </div>
                        </button>
                    </div>

                    {/* 下方保留數據回顧快捷鍵，配合風格設計 */}
                    <div className="px-6 mt-12 mb-4">
                        <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2 mb-5">
                            <div className="h-px bg-slate-200 flex-1"></div>
                            <span>數據回顧與統計</span>
                            <div className="h-px bg-slate-200 flex-1"></div>
                        </h2>
                        <div className="grid grid-cols-2 gap-3">
                            <div onClick={() => onSelect('stats1')} className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm border border-white/50 cursor-pointer hover:bg-white transition-colors active:scale-95 text-center">
                                <h3 className="text-xs font-bold text-slate-500 mb-1">搭車紀錄 (本月)</h3>
                                <p className="text-2xl font-extrabold text-[#D4A017]">{thisMonthRides}</p>
                            </div>
                            <div onClick={() => onSelect('stats2')} className="bg-white/80 backdrop-blur rounded-2xl p-4 shadow-sm border border-white/50 cursor-pointer hover:bg-white transition-colors active:scale-95 text-center">
                                <h3 className="text-xs font-bold text-slate-500 mb-1">客量統計 (本月)</h3>
                                <p className="text-2xl font-extrabold text-[#4285F4]">{thisMonthTrips}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 根元件 (Root App) - 管理全局狀態
        // ==========================================
        function App() {
            const [currentApp, setCurrentApp] = useState('menu');
            
            const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('bus_records') || '[]'));
            const [busDatabase, setBusDatabase] = useState({});
            const [sheetUrl, setSheetUrl] = useState(() => localStorage.getItem('google_sheet_url') || DEFAULT_SHEET_URL);
            const [isLoadingDB, setIsLoadingDB] = useState(false);
            const [dbError, setDbError] = useState('');
            
            const [busCounterStats, setBusCounterStats] = useState(() => {
                const saved = localStorage.getItem('busCounterStats');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return { yearly: { trips: {}, total: 0 }, monthly: { trips: {}, total: 0 }, tripLogs: [], lastSaveTime: Date.now() };
            });

            useEffect(() => { localStorage.setItem('bus_records', JSON.stringify(records)); }, [records]);
            
            // 初次載入時，正常 fetch (不強制更新)
            useEffect(() => { fetchDatabase(sheetUrl, false); }, [sheetUrl]);

            // 修改 fetchDatabase 加入 localStorage 快取邏輯
            const fetchDatabase = async (url, forceRefresh = false) => {
                if (!url) return;

                // 檢查是否有快取，如果沒有強制更新，則判斷快取是否過期
                if (!forceRefresh) {
                    const cachedTime = localStorage.getItem('busDatabaseLastFetch');
                    const cachedData = localStorage.getItem('busDatabaseCache');

                    if (cachedTime && cachedData) {
                        const now = new Date();
                        const lastFetch = new Date(parseInt(cachedTime));
                        
                        // 如果是同一天內，就直接使用快取 (不發起網絡請求)
                        if (now.toDateString() === lastFetch.toDateString()) {
                            try {
                                setBusDatabase(JSON.parse(cachedData));
                                return; // 跳出函數，不繼續下載
                            } catch (e) {
                                // 快取損壞，繼續下載
                            }
                        }
                    }
                }

                setIsLoadingDB(true); setDbError('');
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`連線失敗`);
                    const text = await res.text();
                    const lines = text.split(/\r?\n/).slice(1);
                    const newDb = {};
                    lines.forEach(line => {
                        if (!line.trim()) return;
                        const parts = []; let cur = ''; let inQuote = false;
                        for (let j = 0; j < line.length; j++) {
                            if (line[j] === '"') inQuote = !inQuote;
                            else if (line[j] === ',' && !inQuote) { parts.push(cur); cur = ''; }
                            else cur += line[j];
                        }
                        parts.push(cur);
                        if (parts.length < 5) return; 
                        const rawCompany = parts[0]?.replace(/^"|"$/g, '').trim();
                        const maker = parts[1]?.replace(/^"|"$/g, '').trim();
                        const majorModel = parts[2]?.replace(/^"|"$/g, '').trim(); 
                        const minorModel = parts[3]?.replace(/^"|"$/g, '').trim(); 
                        const fleetNum = parts[4]?.replace(/^"|"$/g, '').trim(); 
                        const plateNum = parts[5]?.replace(/^"|"$/g, '').trim(); 
                        if (!rawCompany || !maker || !minorModel || !fleetNum) return;
                        const company = COMPANY_MAPPING[rawCompany.toUpperCase()] || rawCompany;
                        let displayBusId = plateNum ? `${fleetNum} (${plateNum})` : fleetNum;
                        
                        if (!newDb[company]) newDb[company] = {};
                        if (!newDb[company][maker]) newDb[company][maker] = {};
                        if (!newDb[company][maker][majorModel || minorModel]) newDb[company][maker][majorModel || minorModel] = {};
                        if (!newDb[company][maker][majorModel || minorModel][minorModel]) newDb[company][maker][majorModel || minorModel][minorModel] = [];
                        if (!newDb[company][maker][majorModel || minorModel][minorModel].includes(displayBusId)) {
                            newDb[company][maker][majorModel || minorModel][minorModel].push(displayBusId);
                        }
                    });
                    
                    setBusDatabase(newDb);
                    
                    // 下載成功後，更新本地快取及時間戳記
                    localStorage.setItem('busDatabaseCache', JSON.stringify(newDb));
                    localStorage.setItem('busDatabaseLastFetch', Date.now().toString());
                    
                } catch (e) { 
                    // 如果下載失敗 (例如無網絡)，嘗試使用舊快取
                    const cachedData = localStorage.getItem('busDatabaseCache');
                    if (cachedData) {
                        try {
                            setBusDatabase(JSON.parse(cachedData));
                            setDbError('連線失敗，已使用舊有緩存資料');
                            return;
                        } catch (err) {}
                    }
                    setDbError(e.message); 
                } finally { 
                    setIsLoadingDB(false); 
                }
            };

            const handleAutoSaveRecord = ({ company, route, plate, comment }) => {
                let maker = '', majorModel = '', minorModel = '';
                let exactMatchedPlate = plate; 

                const compData = busDatabase[company];
                if (compData) {
                    for(const mkr in compData) {
                        for(const maj in compData[mkr]) {
                            for(const min in compData[mkr][maj]) {
                                const foundPlate = compData[mkr][maj][min].find(b => b.toUpperCase().includes(plate.toUpperCase()));
                                if (foundPlate) {
                                    maker = mkr; majorModel = maj; minorModel = min;
                                    exactMatchedPlate = foundPlate; 
                                }
                            }
                        }
                    }
                }
                
                const defaultTag = `由客量統計自動匯入 (路線: ${route})`;
                const finalComment = comment && comment.trim() !== '' ? `${comment}\n(${defaultTag})` : defaultTag;
                
                const newRecord = { 
                    id: Date.now().toString(), 
                    date: new Date().toISOString().split('T')[0], 
                    company, 
                    specificBus: exactMatchedPlate,
                    maker, majorModel, minorModel, model: minorModel, 
                    comment: finalComment 
                };
                setRecords(prev => [newRecord, ...prev]);
            };

            const manualClearStats = () => {
                if (window.confirm('確定要清空所有統計資料嗎？此動作無法復原。')) {
                    const empty = { yearly: { trips: {}, total: 0 }, monthly: { trips: {}, total: 0 }, tripLogs: [], lastSaveTime: Date.now() };
                    setBusCounterStats(empty);
                    localStorage.setItem('busCounterStats', JSON.stringify(empty));
                }
            };
            
            const getCompanyColor = (comp) => comp === 'KMB' ? 'bg-red-600 border-red-700 text-white' : comp === 'CTB' ? 'bg-yellow-400 border-yellow-500 text-black' : comp === 'NLB' ? 'bg-teal-600 border-teal-700 text-white' : 'bg-gray-400 border-gray-500 text-white';

            return (
                <>
                    <datalist id="known-plates">
                        {Array.from(new Set(records.map(r => r.specificBus).filter(Boolean))).sort().map(p => <option key={p} value={p} />)}
                    </datalist>

                    {currentApp === 'app1' && <RideRecordApp onBack={() => setCurrentApp('menu')} records={records} setRecords={setRecords} busDatabase={busDatabase} sheetUrl={sheetUrl} setSheetUrl={setSheetUrl} fetchDatabase={fetchDatabase} isLoadingDB={isLoadingDB} dbError={dbError} />}
                    {currentApp === 'app2' && <BusCounterApp onBack={() => setCurrentApp('menu')} onAutoSaveRecord={handleAutoSaveRecord} statsData={busCounterStats} setStatsData={setBusCounterStats} busDatabase={busDatabase} />}
                    {currentApp === 'stats1' && <RideRecordStats onBack={() => setCurrentApp('menu')} records={records} busDatabase={busDatabase} />}
                    {currentApp === 'stats2' && <BusCounterStats onBack={() => setCurrentApp('menu')} statsData={busCounterStats} setStatsData={setBusCounterStats} manualClearStats={manualClearStats} getCompanyColor={getCompanyColor} />}
                    {currentApp === 'menu' && <MainMenu onSelect={setCurrentApp} records={records} statsData={busCounterStats} />}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
