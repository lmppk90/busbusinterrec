<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>客量統計</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3201/3201884.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <style>
        body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        #root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
        
        /* 隱藏數字輸入框嘅原生上下箭咀 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* 隱藏過濾列的滾動條但保留滾動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
            Plus, Minus, RotateCcw, FileText, ChevronRight, ChevronLeft, Search, 
            Loader2, AlertCircle, Clock, Edit3, List, Users, Settings, 
            Copy, Check, BusFront, User, Hash, Info, MapPin, AlertTriangle, X, Pencil, Calculator, Timer,
            BarChart3, Trash2, TrendingUp, Calendar, CheckCircle2, StickyNote, Eye, EyeOff, GitMerge, FileSpreadsheet, Lightbulb, UserPlus, ArrowDownToLine, StopCircle,
            Bus, ArrowLeft, Save, MessageSquare, CheckCircle, XCircle, RefreshCw, List as ListIcon, History, Camera, Home, ClipboardList, ChevronDown
        } from 'lucide-react';

        // 共享常數
        const COMPANY_STYLES = {
          "城巴": { bg: "bg-yellow-400", text: "text-blue-900", border: "border-yellow-500", lightBg: "bg-yellow-50", badge: "bg-yellow-400 text-blue-900", headerBg: "bg-yellow-400", headerText: "text-blue-900" },
          "九巴": { bg: "bg-red-600", text: "text-white", border: "border-red-700", lightBg: "bg-red-50", badge: "bg-red-600 text-white", headerBg: "bg-red-600", headerText: "text-white" },
          "龍運": { bg: "bg-orange-500", text: "text-white", border: "border-orange-600", lightBg: "bg-orange-50", badge: "bg-orange-500 text-white", headerBg: "bg-orange-500", headerText: "text-white" },
          "新大嶼山巴士": { bg: "bg-emerald-600", text: "text-white", border: "border-emerald-700", lightBg: "bg-emerald-50", badge: "bg-emerald-600 text-white", headerBg: "bg-emerald-600", headerText: "text-white" },
          "預設": { bg: "bg-blue-600", text: "text-white", border: "border-blue-700", lightBg: "bg-blue-50", badge: "bg-blue-600 text-white", headerBg: "bg-blue-600", headerText: "text-white" }
        };
        const COMPANY_MAPPING = { "CTB": "城巴", "KMB": "九巴", "LWB": "龍運", "NLB": "新大嶼山巴士" };
        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBgi317ViAQll6wiBhtv_FONfG0A-9nKiNZoaMl70MeOeEvfRoF1TRA1W9ZmiTMuO7kTetDe7uUx2K/pub?output=csv";

        // ==========================================
        // 智能 OCR 處理函數 (Gemini AI)
        // ==========================================
        const performOCR = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    try {
                        const base64Data = reader.result.split(',')[1];
                        const apiKey = ""; // Runtime 提供
                        const payload = {
                            contents: [{
                                role: "user",
                                parts: [
                                    { text: "Extract ONLY the bus fleet number (e.g. 8123, ATENU1, V6B1) or license plate (e.g. SE6123, UU1234) visible in this image. Return ONLY the alphanumeric text, no spaces, no punctuation, no other words. If you cannot find any, return NONE." },
                                    { inlineData: { mimeType: file.type, data: base64Data } }
                                ]
                            }]
                        };

                        let response;
                        let retries = 5;
                        let delays = [1000, 2000, 4000, 8000, 16000];
                        for (let i = 0; i < retries; i++) {
                            try {
                                response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                if (response.ok) break;
                            } catch (e) {}
                            if (i < retries - 1) await new Promise(r => setTimeout(r, delays[i]));
                        }

                        if (!response || !response.ok) throw new Error("API 請求失敗");
                        const result = await response.json();
                        let text = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                        if (text && text !== "NONE") {
                            resolve(text.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
                        } else {
                            resolve(null);
                        }
                    } catch (e) {
                        reject(e);
                    }
                };
                reader.onerror = () => reject(new Error("無法讀取檔案"));
            });
        };

        // ==========================================
        // 智能建議輸入框 (Autocomplete Component)
        // ==========================================
        const AutocompleteInput = ({ value, onChange, options, placeholder, className, icon, onOcr, isOcrLoading, ocrMessage }) => {
            const [show, setShow] = useState(false);
            const filtered = value ? options.filter(o => o.toUpperCase().includes(value.toUpperCase()) && o !== value) : [];
            
            return (
                <div className="relative w-full">
                    {icon && <div className="absolute left-3 top-3.5 text-gray-400">{icon}</div>}
                    <input 
                        type="text" 
                        value={value} 
                        onChange={(e) => { onChange(e.target.value); setShow(true); }}
                        onFocus={() => setShow(true)}
                        onBlur={() => setTimeout(() => setShow(false), 200)} 
                        className={`${className} ${icon ? 'pl-10' : 'pl-3'} ${onOcr ? 'pr-28' : 'pr-3'}`}
                        placeholder={placeholder}
                    />
                    {onOcr && (
                        <div className="absolute right-2 top-2 flex items-center gap-1.5">
                            <span className="text-[10px] text-blue-600 font-bold px-1.5 py-0.5 rounded-md bg-blue-100/80 pointer-events-none hidden sm:block whitespace-nowrap shadow-sm">
                                OCR 測試中
                            </span>
                            <button
                                type="button"
                                onClick={onOcr}
                                disabled={isOcrLoading}
                                className="p-1.5 bg-blue-50 border border-blue-200 text-blue-600 rounded-lg hover:bg-blue-100 disabled:opacity-50 transition-colors shadow-sm flex items-center justify-center relative group"
                                title="相機 OCR 辨識 (測試中)"
                            >
                                {isOcrLoading ? <Loader2 size={16} className="animate-spin" /> : <Camera size={16} />}
                                <span className="absolute -top-8 right-0 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity sm:hidden">
                                    OCR (測試中)
                                </span>
                            </button>
                        </div>
                    )}
                    {show && filtered.length > 0 && (
                        <div className="absolute z-[100] left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-2xl max-h-48 overflow-y-auto">
                            {filtered.map((opt, i) => (
                                <div 
                                    key={i} 
                                    onMouseDown={(e) => { e.preventDefault(); onChange(opt); setShow(false); }}
                                    className="px-4 py-3 hover:bg-blue-50 border-b border-gray-50 last:border-0 cursor-pointer font-bold text-gray-800 text-sm active:bg-blue-100"
                                >
                                    {opt}
                                </div>
                            ))}
                        </div>
                    )}
                    {ocrMessage && (
                        <div className={`text-xs font-bold mt-1.5 ml-1 ${ocrMessage.includes('成功') ? 'text-green-600' : 'text-red-500'}`}>
                            {ocrMessage}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // App 1: 搭車紀錄 (輸入與列表)
        // ==========================================
        function RideRecordApp({ onBack, records, setRecords, busDatabase, sheetUrl, setSheetUrl, fetchDatabase, isLoadingDB, dbError }) {
          const [currentView, setCurrentView] = useState('home'); 
          const [viewMode, setViewMode] = useState('company'); 
          const [draftRecord, setDraftRecord] = useState({ date: new Date().toISOString().split('T')[0], specificBus: '' });
          const [fleetFilter, setFleetFilter] = useState('all');
          const [searchQuery, setSearchQuery] = useState('');
          const [searchResults, setSearchResults] = useState([]);
          const [clickCount, setClickCount] = useState(0);
          const [lastClickTime, setLastClickTime] = useState(0);
          
          const [isOcrLoading, setIsOcrLoading] = useState(false);
          const [ocrMessage, setOcrMessage] = useState('');
          const fileInputRef = useRef(null);

          const [isSearchOcrLoading, setIsSearchOcrLoading] = useState(false);
          const [searchOcrMessage, setSearchOcrMessage] = useState('');
          const searchFileInputRef = useRef(null);

          // 列表頁與首頁共用多選過濾狀態
          const [listFilters, setListFilters] = useState([]);

          const handleSecretClick = () => {
            const now = Date.now();
            if (now - lastClickTime > 800) setClickCount(1);
            else {
              const newCount = clickCount + 1;
              setClickCount(newCount);
              if (newCount >= 10) { setCurrentView('settings'); setClickCount(0); }
            }
            setLastClickTime(now);
          };

          const goBack = () => {
            if (currentView === 'settings') setCurrentView('home');
            else if (currentView === 'details') setCurrentView('fleetNumber');
            else if (currentView === 'fleetNumber') setCurrentView('select_minor');
            else if (currentView === 'select_minor') {
                if (viewMode === 'company') setCurrentView('select_maker');
                else if (viewMode === 'maker') setCurrentView('select_major');
                else if (viewMode === 'model_view') setCurrentView('select_company');
            }
            else if (currentView === 'select_major') setCurrentView('select_company');
            else if (currentView === 'select_company' || currentView === 'select_maker') setCurrentView('home');
            else if (currentView === 'list') setCurrentView('home');
          };

          const handleSave = () => {
            if (!draftRecord.specificBus) { alert("請輸入或選擇車輛！"); return; }
            const newRecord = { ...draftRecord, id: Date.now().toString() };
            setRecords([newRecord, ...records]);
            setCurrentView('home');
            setDraftRecord({ date: new Date().toISOString().split('T')[0], specificBus: '' });
            setSearchQuery('');
          };

          const handleDeleteRecord = (id) => {
            if (window.confirm("確定要刪除這筆紀錄？此動作無法復原。")) {
                setRecords(records.filter(r => r.id !== id));
            }
          };

          const handleOcrUpload = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            setIsOcrLoading(true); setOcrMessage('');
            try {
                const text = await performOCR(file);
                if (text) {
                    setDraftRecord({ ...draftRecord, specificBus: text });
                    setOcrMessage('✅ OCR 辨識成功！');
                } else {
                    setOcrMessage('❌ 未能辨識，請重試或手動輸入');
                }
            } catch (err) {
                setOcrMessage('❌ OCR 系統發生錯誤');
            }
            setTimeout(() => setOcrMessage(''), 4000);
            setIsOcrLoading(false);
            e.target.value = null; 
          };

          const handleSearchOcrUpload = async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            setIsSearchOcrLoading(true); setSearchOcrMessage('');
            try {
                const text = await performOCR(file);
                if (text) {
                    handleSearch(text);
                    setSearchOcrMessage('✅ OCR 辨識成功！');
                } else {
                    setSearchOcrMessage('❌ 未能辨識，請重試或手動輸入');
                }
            } catch (err) {
                setSearchOcrMessage('❌ OCR 系統發生錯誤');
            }
            setTimeout(() => setSearchOcrMessage(''), 4000);
            setIsSearchOcrLoading(false);
            e.target.value = null; 
          };

          const handleSearch = (query) => {
            setSearchQuery(query);
            if (!query.trim()) { setSearchResults([]); return; }
            const results = [];
            const q = query.toLowerCase();
            for (const [company, makers] of Object.entries(busDatabase)) {
              for (const [maker, majors] of Object.entries(makers)) {
                for (const [major, minors] of Object.entries(majors)) {
                  for (const [minor, identifiers] of Object.entries(minors)) {
                     for (const id of identifiers) {
                        if (id.toLowerCase().includes(q)) {
                          results.push({ company, maker, major, minor, id });
                          if (results.length > 50) return; 
                        }
                     }
                  }
                }
              }
            }
            setSearchResults(results);
          };

          // 核心：過濾計算功能
          const calculateStats = (filterObj) => {
            let total = 0; let riddenSet = new Set();
            
            Object.entries(busDatabase).forEach(([c, makers]) => {
              // 應用過濾器
              if (listFilters.length > 0 && !listFilters.includes(c)) return;
              if (filterObj.company && filterObj.company !== c) return;
              
              Object.entries(makers).forEach(([m, majors]) => {
                if (filterObj.maker && filterObj.maker !== m) return;
                Object.entries(majors).forEach(([maj, minors]) => {
                  if (filterObj.majorModel && filterObj.majorModel !== maj) return;
                  Object.entries(minors).forEach(([min, fleets]) => {
                     if (filterObj.minorModel && filterObj.minorModel !== min) return;
                     total += fleets.length;
                  });
                });
              });
            });

            records.forEach(r => {
              if (listFilters.length > 0 && !listFilters.includes(r.company)) return;
              if (filterObj.company && filterObj.company !== r.company) return;
              if (filterObj.maker && r.maker !== filterObj.maker) return;
              if (filterObj.majorModel && r.majorModel !== filterObj.majorModel) return; 
              const rMinor = r.minorModel || r.model;
              if (filterObj.minorModel && rMinor !== filterObj.minorModel) return;
              if (r.specificBus) riddenSet.add(r.specificBus);
            });
            return { total, ridden: riddenSet.size };
          };

          const deduceMakerFromMajor = (company, major) => {
              const makers = busDatabase[company] || {};
              for (const [m, majors] of Object.entries(makers)) { if (majors[major]) return m; }
              return '';
          };
          const deduceMajorFromMinor = (company, maker, minor) => {
              const majors = busDatabase[company]?.[maker] || {};
              for (const [maj, minors] of Object.entries(majors)) { if (minors[minor]) return maj; }
              return minor;
          };
          const getMinorsList = () => {
              const minors = new Set();
              if (viewMode === 'company') {
                  const majors = busDatabase[draftRecord.company]?.[draftRecord.maker] || {};
                  Object.values(majors).forEach(minorObj => Object.keys(minorObj).forEach(m => minors.add(m)));
              } else {
                  const minorsObj = busDatabase[draftRecord.company]?.[draftRecord.maker]?.[draftRecord.majorModel] || {};
                  Object.keys(minorsObj).forEach(m => minors.add(m));
              }
              return Array.from(minors).sort();
          };
          const getFleetOptions = () => busDatabase[draftRecord.company]?.[draftRecord.maker]?.[draftRecord.majorModel]?.[draftRecord.minorModel] || [];
          const getThemeStyle = () => {
            if (draftRecord.company && currentView !== 'home' && currentView !== 'select_company') return COMPANY_STYLES[draftRecord.company] || COMPANY_STYLES["預設"];
            return { headerBg: "bg-white", headerText: "text-gray-800 border-b border-gray-100", bg: "bg-blue-600", text: "text-white", border: "border-gray-200" };
          };
          const theme = getThemeStyle();
          const formatShortDate = (dateString) => {
            if (!dateString) return '';
            const d = new Date(dateString);
            return isNaN(d.getTime()) ? dateString : `${d.getMonth() + 1}月${d.getDate()}日`;
          };

          // 可重用的過濾器元件
          const renderCompanyFilterBar = (availableComps, embedded = false) => {
            if (!availableComps || availableComps.length === 0) return null;
            return (
              <div className={`flex gap-2 overflow-x-auto shadow-sm no-scrollbar shrink-0 ${embedded ? 'px-4 py-2 bg-white' : 'px-4 py-3 bg-white border-b border-gray-100 sticky top-[60px] z-10'}`}>
                <button
                  onClick={() => setListFilters([])}
                  className={`whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition-colors border ${listFilters.length === 0 ? 'bg-slate-700 text-white border-slate-700 shadow-sm' : 'bg-gray-50 text-gray-500 border-gray-200 hover:bg-gray-100'}`}
                >
                  全部顯示
                </button>
                {availableComps.map(comp => {
                  const isSelected = listFilters.includes(comp);
                  const compStyle = COMPANY_STYLES[comp] || COMPANY_STYLES["預設"];
                  return (
                    <button
                      key={comp}
                      onClick={() => {
                        if (listFilters.includes(comp)) setListFilters(listFilters.filter(c => c !== comp));
                        else setListFilters([...listFilters, comp]);
                      }}
                      className={`whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition-colors border ${isSelected ? `${compStyle.bg} ${compStyle.text} border-transparent shadow-sm` : 'bg-white text-gray-500 border-gray-300 hover:bg-gray-50'}`}
                    >
                      {comp}
                    </button>
                  )
                })}
              </div>
            );
          };

          const renderHome = () => {
            let homeItems = [];
            if (viewMode === 'company') {
                homeItems = Object.keys(busDatabase);
            } else if (viewMode === 'maker') {
                const makers = new Set();
                Object.entries(busDatabase).forEach(([c, makersObj]) => {
                    if (listFilters.length > 0 && !listFilters.includes(c)) return;
                    Object.keys(makersObj).forEach(m => makers.add(m));
                });
                homeItems = Array.from(makers).sort();
            } else if (viewMode === 'model_view') {
                const majors = new Set();
                Object.entries(busDatabase).forEach(([c, makersObj]) => {
                    if (listFilters.length > 0 && !listFilters.includes(c)) return;
                    Object.values(makersObj).forEach(m => Object.keys(m).forEach(maj => majors.add(maj)));
                });
                homeItems = Array.from(majors).sort();
            }

            const dbCompanies = Object.keys(busDatabase);

            return (
            <div className="flex flex-col h-full bg-gray-50">
              <div className="bg-white text-gray-800 p-4 flex justify-between items-center sticky top-0 z-20 shadow-sm border-b border-gray-100 shrink-0">
                <div className="flex items-center gap-3">
                  <button onClick={onBack} className="p-2 -ml-2 rounded-full hover:bg-gray-100 text-gray-600 transition-colors"><ArrowLeft size={24} /></button>
                  <h1 onClick={handleSecretClick} className="text-xl font-bold flex items-center gap-2 cursor-pointer select-none">
                    <ClipboardList size={24} className="text-blue-600" /> 搭車紀錄
                    {isLoadingDB && <RefreshCw size={16} className="animate-spin text-gray-400" />}
                  </h1>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setCurrentView('list')} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors relative">
                    <ListIcon size={22} />
                    {records.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}
                  </button>
                </div>
              </div>

              <div className="bg-white sticky top-[68px] z-10 shadow-sm border-b border-gray-100 flex flex-col shrink-0">
                <div className="p-4 pb-3">
                  <div className="flex flex-col gap-1 mb-3">
                    <div className="flex gap-2">
                      <div className="relative flex-1">
                        <Search className="absolute left-3 top-3.5 text-gray-400" size={20} />
                        <input type="file" ref={searchFileInputRef} hidden accept="image/*" onChange={handleSearchOcrUpload} />
                        <input type="text" placeholder="搜尋車隊編號或車牌..." value={searchQuery} onChange={(e) => handleSearch(e.target.value)} className={`w-full bg-gray-100 pl-10 ${searchQuery ? 'pr-20' : 'pr-12'} py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg transition-shadow`} />
                        
                        <div className="absolute right-2 top-2 flex items-center gap-1">
                          {searchQuery && <button onClick={() => handleSearch('')} className="p-1.5 text-gray-400 hover:text-gray-600 transition-colors"><XCircle size={20} /></button>}
                          <button
                              type="button"
                              onClick={() => searchFileInputRef.current?.click()}
                              disabled={isSearchOcrLoading}
                              className="p-1.5 bg-blue-50 border border-blue-200 text-blue-600 rounded-lg hover:bg-blue-100 disabled:opacity-50 transition-colors shadow-sm flex items-center justify-center relative group"
                              title="相機 OCR 辨識 (測試中)"
                          >
                              {isSearchOcrLoading ? <Loader2 size={16} className="animate-spin" /> : <Camera size={16} />}
                              <span className="absolute -top-8 right-0 bg-black text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none transition-opacity hidden sm:block">
                                  OCR (測試中)
                              </span>
                          </button>
                        </div>
                      </div>
                    </div>
                    {searchOcrMessage && (
                      <div className={`text-xs font-bold ml-1 ${searchOcrMessage.includes('成功') ? 'text-green-600' : 'text-red-500'}`}>
                          {searchOcrMessage}
                      </div>
                    )}
                  </div>
                  {!searchQuery && (
                    <div className="flex bg-gray-200/60 p-1 rounded-xl gap-1">
                      <button onClick={() => { setViewMode('company'); setDraftRecord({ date: draftRecord.date }); setListFilters([]); }} className={`flex-1 py-1.5 text-sm font-bold rounded-lg transition-all ${viewMode === 'company' ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>公司</button>
                      <button onClick={() => { setViewMode('maker'); setDraftRecord({ date: draftRecord.date }); }} className={`flex-1 py-1.5 text-sm font-bold rounded-lg transition-all ${viewMode === 'maker' ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>車廠</button>
                      <button onClick={() => { setViewMode('model_view'); setDraftRecord({ date: draftRecord.date }); }} className={`flex-1 py-1.5 text-sm font-bold rounded-lg transition-all ${viewMode === 'model_view' ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>車型</button>
                    </div>
                  )}
                </div>
                
                {/* 車廠及車型視圖下顯示多選過濾器 */}
                {!searchQuery && viewMode !== 'company' && renderCompanyFilterBar(dbCompanies, true)}
              </div>

              <div className="flex-1 overflow-y-auto p-4">
                {searchQuery ? (
                  searchResults.length > 0 ? (
                    <div className="space-y-3">
                      <h2 className="text-sm font-bold text-gray-500 mb-1 ml-1">搜尋結果：</h2>
                      {searchResults.map((res, idx) => (
                        <button key={idx} onClick={() => { setDraftRecord({ ...draftRecord, company: res.company, maker: res.maker, majorModel: res.major, minorModel: res.minor, specificBus: res.id, model: res.minor }); setCurrentView('details'); }} className="w-full bg-white border border-gray-200 p-4 rounded-xl shadow-sm flex items-center justify-between active:bg-blue-50 transition-colors text-left hover:border-blue-300">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className={`text-xs px-2 py-0.5 rounded shadow-sm font-bold ${COMPANY_STYLES[res.company]?.badge || COMPANY_STYLES["預設"].badge}`}>{res.company}</span>
                              <span className="font-bold text-lg text-gray-900">{res.id}</span>
                            </div>
                            <div className="text-sm text-gray-500 flex items-center gap-1"><span>{res.maker}</span><ChevronRight size={12} /><span>{res.minor}</span></div>
                          </div>
                          <div className="bg-blue-50 text-blue-600 text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 shrink-0 ml-2">去評論 <ChevronRight size={14} /></div>
                        </button>
                      ))}
                    </div>
                  ) : (
                     <div className="text-center py-12 text-gray-500"><Search size={48} className="mx-auto text-gray-300 mb-3" /><p className="text-lg font-bold text-gray-700">搵唔到呢架車</p></div>
                  )
                ) : (
                  <div className="space-y-3">
                    {homeItems.length === 0 && !isLoadingDB && !dbError ? (
                      <div className="text-center p-6 text-gray-500 border-2 border-dashed border-gray-300 rounded-xl">資料庫空白或無符合條件</div>
                    ) : (
                      homeItems.map(item => {
                        const style = viewMode === 'company' ? (COMPANY_STYLES[item] || COMPANY_STYLES["預設"]) : { bg: 'bg-white', text: 'text-gray-800', border: 'border-gray-200' };
                        let filterObj = {};
                        if (viewMode === 'company') filterObj = { company: item };
                        else if (viewMode === 'maker') filterObj = { maker: item };
                        else if (viewMode === 'model_view') filterObj = { majorModel: item }; 
                        const stats = calculateStats(filterObj);
                        
                        // 當過濾後某車廠/車型數量為0，選擇性隱藏
                        if (viewMode !== 'company' && stats.total === 0) return null;

                        return (
                        <button key={item} onClick={() => { 
                            if (viewMode === 'company') { setDraftRecord({ ...draftRecord, company: item }); setCurrentView('select_maker'); }
                            else if (viewMode === 'maker') { setDraftRecord({ ...draftRecord, maker: item }); setCurrentView('select_company'); }
                            else if (viewMode === 'model_view') { setDraftRecord({ ...draftRecord, majorModel: item }); setCurrentView('select_company'); }
                          }}
                          className={`w-full p-4 rounded-xl shadow-sm flex justify-between items-center transition-transform active:scale-95 text-left border-2 ${style.bg} ${style.text} ${style.border} hover:opacity-90`}
                        >
                          <span className="text-xl font-bold">{item}</span>
                          <div className="flex items-center gap-2">
                            <span className={`text-sm font-bold px-2 py-0.5 rounded-lg ${viewMode === 'company' ? 'bg-white/20' : 'bg-gray-100 text-gray-600'}`}>
                              {stats.ridden} / {stats.total}
                            </span>
                            <ChevronRight size={24} className={viewMode === 'company' ? 'opacity-70' : 'text-gray-400'} />
                          </div>
                        </button>
                      )})
                    )}
                  </div>
                )}
              </div>
            </div>
          )};

          const renderGenericMenu = (title, items, onClickItem, getStatsFilter, isCompanyLayer = false) => (
            <div className="flex flex-col h-full bg-gray-50">
              <div className={`p-4 shadow-sm flex items-center gap-3 sticky top-0 z-10 ${theme.headerBg} ${theme.headerText}`}>
                <button onClick={goBack} className="p-2 -ml-2 rounded-full hover:bg-black/10 active:bg-black/20"><ArrowLeft size={24} /></button>
                <h1 className="text-xl font-bold">{title}</h1>
              </div>
              <div className="p-4 grid grid-cols-1 gap-3 overflow-y-auto">
                {items.map(item => {
                  const stats = calculateStats(getStatsFilter(item));
                  if (stats.total === 0 && !isCompanyLayer) return null;
                  
                  const style = isCompanyLayer ? (COMPANY_STYLES[item] || COMPANY_STYLES["預設"]) : { bg: 'bg-white', text: 'text-gray-800', border: 'border-gray-200' };
                  return (
                  <button key={item} onClick={() => onClickItem(item)} className={`w-full p-4 rounded-xl shadow-sm flex justify-between items-center active:scale-95 text-left border-2 ${style.bg} ${style.text} ${style.border}`}>
                    <span className="text-lg font-bold">{item}</span>
                    <div className="flex items-center gap-2">
                      <span className={`text-sm font-bold px-2 py-0.5 rounded-lg ${isCompanyLayer ? 'bg-white/20' : 'bg-gray-100 text-gray-600'}`}>{stats.ridden} / {stats.total}</span>
                      <ChevronRight size={24} className={isCompanyLayer ? 'opacity-70' : 'text-gray-400'} />
                    </div>
                  </button>
                )})}
              </div>
            </div>
          );

          const renderSelectCompany = () => {
            let items = [];
            if (viewMode === 'maker') items = Object.keys(busDatabase).filter(c => busDatabase[c][draftRecord.maker]).sort();
            else if (viewMode === 'model_view') items = Object.keys(busDatabase).filter(c => Object.values(busDatabase[c]).some(m => m[draftRecord.majorModel])).sort();
            
            if (listFilters.length > 0) items = items.filter(c => listFilters.includes(c));

            return renderGenericMenu('揀公司', items, (item) => {
              if (viewMode === 'maker') { setDraftRecord({ ...draftRecord, company: item }); setCurrentView('select_major'); } 
              else if (viewMode === 'model_view') {
                  const deducedMaker = deduceMakerFromMajor(item, draftRecord.majorModel);
                  setDraftRecord({ ...draftRecord, company: item, maker: deducedMaker }); setCurrentView('select_minor');
              }
            }, (item) => ({ company: item, maker: draftRecord.maker, majorModel: draftRecord.majorModel }), true);
          };

          const renderSelectMaker = () => renderGenericMenu('揀車廠', Object.keys(busDatabase[draftRecord.company] || {}), (item) => {
              setDraftRecord({ ...draftRecord, maker: item }); setCurrentView('select_minor');
          }, (item) => ({ company: draftRecord.company, maker: item }));

          const renderSelectMajor = () => renderGenericMenu('揀車型', Object.keys(busDatabase[draftRecord.company]?.[draftRecord.maker] || {}), (item) => {
              setDraftRecord({ ...draftRecord, majorModel: item }); setCurrentView('select_minor');
          }, (item) => ({ company: draftRecord.company, maker: draftRecord.maker, majorModel: item }));

          const renderSelectMinor = () => renderGenericMenu('揀車隊', getMinorsList(), (item) => {
              const newRecord = { ...draftRecord, minorModel: item, model: item };
              if (viewMode === 'company') newRecord.majorModel = deduceMajorFromMinor(draftRecord.company, draftRecord.maker, item);
              setDraftRecord(newRecord); setFleetFilter('all'); setCurrentView('fleetNumber');
          }, (item) => ({ company: draftRecord.company, maker: draftRecord.maker, majorModel: draftRecord.majorModel, minorModel: item }));

          const renderFleetSelection = () => {
            const allFleets = getFleetOptions();
            const checkRidden = (f) => records.some(r => r.company === draftRecord.company && (r.minorModel || r.model) === draftRecord.minorModel && r.specificBus === f);
            const displayFleets = fleetFilter === 'ridden' ? allFleets.filter(checkRidden) : fleetFilter === 'unridden' ? allFleets.filter(f => !checkRidden(f)) : allFleets;
            return (
              <div className="flex flex-col h-full bg-gray-50">
                <div className={`p-4 shadow-md flex items-center gap-3 sticky top-0 z-10 ${theme.headerBg} ${theme.headerText}`}>
                  <button onClick={goBack} className="p-2 -ml-2 rounded-full hover:bg-black/10 active:bg-black/20"><ArrowLeft size={24} /></button>
                  <h1 className="text-xl font-bold">揀車輛</h1>
                </div>
                {allFleets.length === 0 ? (
                  <div className="p-4"><div className="text-center p-6 bg-white border border-gray-200 rounded-xl shadow-sm"><p className="text-gray-500 mb-4">未有清單，請自行輸入</p><button onClick={() => { setDraftRecord({ ...draftRecord, specificBus: '' }); setCurrentView('details'); }} className={`${theme.bg} ${theme.text} font-bold py-3 px-4 rounded-xl w-full`}>手動輸入</button></div></div>
                ) : (
                  <>
                    <div className="px-4 pt-4 pb-2">
                      <div className="flex bg-gray-200/60 p-1 rounded-xl">
                        <button onClick={() => setFleetFilter('all')} className={`flex-1 py-1.5 text-sm font-medium rounded-lg ${fleetFilter === 'all' ? 'bg-white shadow text-gray-800' : 'text-gray-500'}`}>全部</button>
                        <button onClick={() => setFleetFilter('ridden')} className={`flex-1 py-1.5 text-sm font-medium rounded-lg flex items-center justify-center gap-1 ${fleetFilter === 'ridden' ? 'bg-white shadow text-green-700' : 'text-gray-500'}`}><CheckCircle size={14} /> 搭過</button>
                        <button onClick={() => setFleetFilter('unridden')} className={`flex-1 py-1.5 text-sm font-medium rounded-lg flex items-center justify-center gap-1 ${fleetFilter === 'unridden' ? 'bg-white shadow text-red-700' : 'text-gray-500'}`}><XCircle size={14} /> 未搭</button>
                      </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 pt-2">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                        {displayFleets.map(item => (
                          <button key={item} onClick={() => { setDraftRecord({ ...draftRecord, specificBus: item }); setCurrentView('details'); }} className={`py-4 px-3 rounded-xl border-2 text-center font-bold text-lg active:scale-95 break-all transition-colors shadow-sm ${checkRidden(item) ? 'bg-green-100 border-green-500 text-green-800' : 'bg-white border-red-300 text-red-700 hover:border-red-500'}`}>{item}</button>
                        ))}
                      </div>
                      <button onClick={() => { setDraftRecord({ ...draftRecord, specificBus: '' }); setCurrentView('details'); }} className="w-full bg-white border border-gray-300 p-4 rounded-xl shadow-sm flex justify-center items-center gap-2"><span className="text-lg font-medium text-gray-700">其他 (手動輸入)</span></button>
                    </div>
                  </>
                )}
              </div>
            );
          };

          const renderDetails = () => {
            const pastReviews = records.filter(r => r.company === draftRecord.company && (r.minorModel || r.model) === draftRecord.minorModel && r.specificBus && r.specificBus === draftRecord.specificBus).sort((a, b) => new Date(b.date) - new Date(a.date));
            const fleetOptions = getFleetOptions();

            return (
              <div className="flex flex-col h-full bg-gray-50">
                <div className={`p-4 shadow-md flex items-center gap-3 sticky top-0 z-10 ${theme.headerBg} ${theme.headerText}`}>
                  <button onClick={goBack} className="p-2 -ml-2 rounded-full hover:bg-black/10 active:bg-black/20"><ArrowLeft size={24} /></button>
                  <h1 className="text-xl font-bold">確認紀錄與評語</h1>
                </div>
                <div className="p-5 space-y-5 flex-1 overflow-y-auto">
                  <div className={`border p-4 rounded-xl flex flex-col gap-2 text-sm shadow-sm ${theme.lightBg} ${theme.border}`}>
                    <div className="flex gap-2 flex-wrap items-center">
                      <span className={`font-bold px-2 py-1 rounded text-xs shadow-sm ${theme.badge}`}>{draftRecord.company}</span>
                      <ChevronRight size={14} className="text-gray-500" />
                      <span className="font-medium text-gray-800">{draftRecord.maker}</span>
                      <ChevronRight size={14} className="text-gray-500" />
                      <span className="font-bold text-gray-900">{draftRecord.minorModel}</span>
                    </div>
                  </div>
                  <div className="space-y-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1"><Hash size={16} /> 車輛 (編號/車牌)</label>
                      <input type="file" ref={fileInputRef} hidden accept="image/*" onChange={handleOcrUpload} />
                      <AutocompleteInput
                          value={draftRecord.specificBus || ''}
                          onChange={(val) => setDraftRecord({ ...draftRecord, specificBus: val })}
                          options={fleetOptions}
                          placeholder="例如: 8123 或者 SE6"
                          className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg font-bold text-center bg-gray-50"
                          onOcr={() => fileInputRef.current?.click()}
                          isOcrLoading={isOcrLoading}
                          ocrMessage={ocrMessage}
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1"><Calendar size={16} /> 乘搭日期</label>
                      <input type="date" value={draftRecord.date || ''} onChange={(e) => setDraftRecord({ ...draftRecord, date: e.target.value })} className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-gray-400 outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1"><MessageSquare size={16} /> 評語 (冷氣、性能等)</label>
                      <textarea rows="3" placeholder="例如：冷氣好夠凍..." value={draftRecord.comment || ''} onChange={(e) => setDraftRecord({ ...draftRecord, comment: e.target.value })} className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-gray-400 outline-none resize-none" autoFocus />
                    </div>
                  </div>
                  {pastReviews.length > 0 && (
                    <div className="space-y-2 mt-4">
                      <h3 className="text-sm font-bold text-gray-500 flex items-center gap-1 pl-1"><History size={16} /> 呢架車嘅過往評價 ({pastReviews.length})</h3>
                      <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden divide-y divide-gray-100">
                        {pastReviews.map(pr => (
                          <div key={pr.id} className="p-3 bg-gray-50/50">
                            <span className="font-bold text-blue-600 text-sm mr-2">{formatShortDate(pr.date)} :</span>
                            <span className="text-sm text-gray-800 break-words">{pr.comment || <span className="text-gray-400 italic">無填寫評語</span>}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
                <div className="p-4 bg-white border-t border-gray-100 pb-8">
                  <button onClick={handleSave} className={`w-full font-bold py-4 rounded-xl shadow-md flex justify-center items-center gap-2 active:opacity-80 transition-opacity ${theme.bg} ${theme.text}`}><Save size={24} /> 儲存紀錄</button>
                </div>
              </div>
            );
          };

          const renderSettings = () => (
            <div className="flex flex-col h-full bg-gray-50">
              <div className="bg-gray-800 text-white p-4 shadow-md flex items-center gap-3 sticky top-0 z-10">
                <button onClick={goBack} className="p-2 -ml-2 rounded-full hover:bg-gray-700 active:bg-gray-600"><ArrowLeft size={24} /></button>
                <h1 className="text-xl font-bold text-yellow-400 flex items-center gap-2">㊙️ 秘密資料庫設定</h1>
              </div>
              <div className="p-5 space-y-6 flex-1 overflow-y-auto">
                <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl text-blue-900 text-sm space-y-2">
                  <h3 className="font-bold text-base flex items-center gap-1"><AlertTriangle size={18} /> Excel 格式要求</h3>
                  <ol className="list-decimal pl-4 space-y-1">
                    <li>A至F欄為：<strong>公司、車廠、車型、車隊、編號、車牌(選填)</strong>。</li>
                    <li>CTB、KMB等縮寫會自動被翻譯為中文。</li>
                    <li><span className="text-green-600 font-bold">已啟用每日快取：</span>系統每日只會下載一次。按「儲存並強制更新」可立即刷新資料庫。</li>
                  </ol>
                </div>
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-2">CSV 連結：</label>
                  <textarea rows="4" value={sheetUrl} onChange={(e) => setSheetUrl(e.target.value)} className="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-gray-800 outline-none transition-all text-sm font-mono break-all" />
                </div>
                <div className="flex gap-3">
                  <button onClick={() => { localStorage.setItem('google_sheet_url', DEFAULT_SHEET_URL); setSheetUrl(DEFAULT_SHEET_URL); }} className="w-1/3 bg-gray-200 text-gray-800 font-bold py-4 rounded-xl active:bg-gray-300 flex flex-col items-center justify-center text-sm leading-tight">還原<br/>預設</button>
                  <button onClick={() => { localStorage.setItem('google_sheet_url', sheetUrl); fetchDatabase(sheetUrl, true); goBack(); }} className="w-2/3 bg-gray-800 text-white font-bold py-4 rounded-xl shadow-md flex justify-center items-center gap-2 active:bg-gray-900"><RefreshCw size={20} /> 儲存並強制更新</button>
                </div>
              </div>
            </div>
          );

          const renderList = () => {
            const availableCompanies = [...new Set(records.map(r => r.company))].filter(Boolean);
            const filteredRecords = records.filter(r => listFilters.length === 0 || listFilters.includes(r.company));

            return (
              <div className="flex flex-col h-full bg-gray-50 pb-6">
                <div className="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-10 shrink-0">
                  <div className="flex items-center gap-2">
                    <button onClick={goBack} className="p-1.5 -ml-1.5 rounded-full hover:bg-blue-700 active:bg-blue-800"><ArrowLeft size={24} /></button>
                    <h1 className="text-xl font-bold">歷史紀錄</h1>
                  </div>
                  <span className="bg-blue-800 px-3 py-1 rounded-full text-sm font-medium">共 {filteredRecords.length} 條</span>
                </div>

                {renderCompanyFilterBar(availableCompanies)}

                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {filteredRecords.length === 0 ? (
                    <div className="text-center text-gray-500 mt-20"><Bus size={64} className="text-gray-300 mb-4 mx-auto" /><p>未有符合條件嘅紀錄</p></div>
                  ) : (
                    filteredRecords.map(record => {
                      const companyStyle = COMPANY_STYLES[record.company] || COMPANY_STYLES["預設"];
                      return (
                      <div key={record.id} className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col gap-2 relative overflow-hidden group">
                        <div className={`absolute top-0 left-0 w-1.5 h-full ${companyStyle.bg}`}></div>
                        
                        <button onClick={() => handleDeleteRecord(record.id)} className="absolute top-3 right-3 text-gray-300 hover:text-red-500 active:text-red-600 transition-colors bg-white/80 rounded-full p-1 z-10">
                            <Trash2 size={18} />
                        </button>

                        <div className="flex justify-between items-start pr-8">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className={`font-bold text-xs px-2 py-0.5 rounded shadow-sm ${companyStyle.badge}`}>{record.company}</span>
                              <span className="text-gray-900 font-bold text-lg">{record.specificBus}</span>
                            </div>
                            <div className="text-sm text-gray-500 flex items-center gap-1 mb-1 flex-wrap">
                              <span className="bg-gray-100 px-2 py-0.5 rounded">{record.maker || '?'}</span>
                              {record.majorModel && <><ChevronRight size={14} className="text-gray-400" /><span className="bg-gray-100 px-2 py-0.5 rounded">{record.majorModel}</span></>}
                              <ChevronRight size={14} className="text-gray-400" />
                              <span className="bg-gray-100 px-2 py-0.5 rounded font-medium">{record.minorModel || record.model || '?'}</span>
                            </div>
                          </div>
                        </div>
                        
                        <div className="text-xs text-gray-500 flex items-center gap-1 bg-gray-50 border border-gray-200 px-2 py-1.5 rounded-lg w-max mt-1"><Calendar size={12} />{record.date}</div>

                        {record.comment && (
                          <div className="mt-1 text-sm text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-100 flex gap-2 items-start">
                            <MessageSquare size={16} className="text-gray-400 shrink-0 mt-0.5" />
                            <p className="leading-relaxed whitespace-pre-wrap">{record.comment}</p>
                          </div>
                        )}
                      </div>
                    )})
                  )}
                </div>
              </div>
            );
          };

          return (
            <div className="h-full w-full bg-gray-50 overflow-hidden shadow-2xl relative font-sans">
              {currentView === 'home' && renderHome()}
              {currentView === 'select_company' && renderSelectCompany()}
              {currentView === 'select_maker' && renderSelectMaker()}
              {currentView === 'select_major' && renderSelectMajor()}
              {currentView === 'select_minor' && renderSelectMinor()}
              {currentView === 'fleetNumber' && renderFleetSelection()}
              {currentView === 'details' && renderDetails()}
              {currentView === 'list' && renderList()}
              {currentView === 'settings' && renderSettings()}
            </div>
          );
        }

        // ==========================================
        // App 1 統計 (RideRecord Stats) 獨立組件
        // ==========================================
        function RideRecordStats({ onBack, records, busDatabase }) {
            const [statTab, setStatTab] = useState('thisMonth');
            const [plateSearch, setPlateSearch] = useState('');

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const l_yyyy = lastMonthDate.getFullYear();
            const l_mm = String(lastMonthDate.getMonth() + 1).padStart(2, '0');

            let title = '';
            let filterPrefix = '';
            if (statTab === 'thisMonth') { title = '本月統計'; filterPrefix = `${yyyy}-${mm}`; }
            else if (statTab === 'lastMonth') { title = '上月回顧'; filterPrefix = `${l_yyyy}-${l_mm}`; }
            else if (statTab === 'thisYear') { title = `${yyyy}年統計`; filterPrefix = `${yyyy}`; }
            else if (statTab === 'lastYear') { title = `${yyyy-1}年統計`; filterPrefix = `${yyyy-1}`; }

            let filtered = records;
            if (plateSearch) {
                title = `搜尋: ${plateSearch}`;
                filtered = records.filter(r => r.specificBus && r.specificBus.toLowerCase().includes(plateSearch.toLowerCase()));
            } else {
                filtered = records.filter(r => r.date && r.date.startsWith(filterPrefix));
            }

            const compData = {};
            const modelData = {};
            filtered.forEach(r => {
                compData[r.company] = (compData[r.company] || 0) + 1;
                const m = r.majorModel || r.model || '未知車型';
                modelData[m] = (modelData[m] || 0) + 1;
            });

            const sortedComp = Object.entries(compData).sort((a,b)=>b[1]-a[1]);
            const sortedModel = Object.entries(modelData).sort((a,b)=>b[1]-a[1]);

            const suggestedPlates = useMemo(() => {
                const plates = new Set();
                records.forEach(r => {
                    if (r.specificBus && r.specificBus.trim() !== '') plates.add(r.specificBus.toUpperCase());
                });
                return Array.from(plates).sort();
            }, [records]);

            return (
                <div className="flex flex-col h-full bg-gray-50 pb-6 w-full max-w-md mx-auto shadow-2xl relative font-sans">
                    <div className="bg-blue-600 text-white p-4 shadow-md flex items-center gap-3 sticky top-0 z-10">

        // ==========================================
        // App 2 統計 (BusCounter Stats) 獨立組件
        // ==========================================
        function BusCounterStats({ onBack, statsData, setStatsData, manualClearStats, getCompanyColor }) {
            const [statsTab, setStatsTab] = useState('monthly');
            const safeStatsData = statsData || { yearly: { trips: {}, total: 0 }, monthly: { trips: {}, total: 0 }, tripLogs: [] };
            
            const yearlyKeys = Object.keys(safeStatsData.yearly?.trips || {}).sort((a, b) => safeStatsData.yearly.trips[b].count - safeStatsData.yearly.trips[a].count);
            const monthlyKeys = Object.keys(safeStatsData.monthly?.trips || {}).sort((a, b) => safeStatsData.monthly.trips[b].count - safeStatsData.monthly.trips[a].count);

            const handleDeleteLog = (id) => {
                if (!window.confirm('確定要刪除這筆紀錄嗎？排行榜的統計數字亦會相應扣減。')) return;
                const newData = JSON.parse(JSON.stringify(safeStatsData));
                const logIndex = newData.tripLogs?.findIndex(l => l.id === id);
                if (logIndex > -1) {
                    const log = newData.tripLogs[logIndex];
                    newData.tripLogs.splice(logIndex, 1);
                    const key = `${log.company}-${log.route}-${log.desc}`;

                    if (newData.yearly?.trips[key]) {
                        newData.yearly.trips[key].count = Math.max(0, newData.yearly.trips[key].count - 1);
                        newData.yearly.total = Math.max(0, newData.yearly.total - 1);
                        if (newData.yearly.trips[key].count === 0) delete newData.yearly.trips[key];
                    }
                    if (newData.monthly?.trips[key]) {
                        newData.monthly.trips[key].count = Math.max(0, newData.monthly.trips[key].count - 1);
                        newData.monthly.total = Math.max(0, newData.monthly.total - 1);
                        if (newData.monthly.trips[key].count === 0) delete newData.monthly.trips[key];
                    }

                    setStatsData(newData);
                    localStorage.setItem('busCounterStats', JSON.stringify(newData));
                }
            };

            return (
                <div className="flex flex-col h-full bg-gray-50 font-sans text-gray-900 relative w-full max-w-md mx-auto shadow-2xl">
                    <header className="bg-white border-b p-4 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="p-1.5 -ml-1.5 rounded-full hover:bg-gray-100 text-gray-600"><ArrowLeft size={24} /></button>
                            <h2 className="text-xl font-bold flex items-center gap-2"><BarChart3 className="w-6 h-6 text-purple-600" /> 客量統計回顧</h2>
                        </div>
                    </header>
                    <div className="px-4 pt-4">
                        <div className="flex bg-gray-200 rounded-lg p-1">
                            <button onClick={() => setStatsTab('monthly')} className={`flex-1 py-1.5 text-sm font-bold rounded-md transition-all ${statsTab === 'monthly' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500'}`}>月度統計</button>
                            <button onClick={() => setStatsTab('yearly')} className={`flex-1 py-1.5 text-sm font-bold rounded-md transition-all ${statsTab === 'yearly' ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-500'}`}>年度統計</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {statsTab === 'monthly' ? (
                            <div className="bg-gradient-to-br from-blue-500 to-cyan-500 rounded-xl p-6 text-white shadow-md relative overflow-hidden transition-all">
                                <div className="relative z-10">
                                    <div className="text-sm font-medium opacity-80 mb-1 flex items-center gap-1"><Calendar className="w-4 h-4"/> 本月行程 ({new Date().getMonth() + 1}月)</div>
                                    <div className="text-4xl font-bold">{safeStatsData.monthly?.total || 0} <span className="text-lg font-normal opacity-80">次</span></div>
                                </div>
                                <BarChart3 className="absolute right-[-10px] bottom-[-10px] w-24 h-24 text-white opacity-20" />
                            </div>
                        ) : (
                            <div className="bg-gradient-to-br from-purple-600 to-indigo-600 rounded-xl p-6 text-white shadow-md relative overflow-hidden transition-all">
                                <div className="relative z-10">
                                    <div className="text-sm font-medium opacity-80 mb-1 flex items-center gap-1"><TrendingUp className="w-4 h-4"/> 本年度行程</div>
                                    <div className="text-4xl font-bold">{safeStatsData.yearly?.total || 0} <span className="text-lg font-normal opacity-80">次</span></div>
                                </div>
                                <TrendingUp className="absolute right-[-10px] bottom-[-10px] w-24 h-24 text-white opacity-20" />
                            </div>
                        )}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="p-4 border-b bg-gray-50 flex justify-between items-center">
                                <h3 className="font-bold text-gray-700">路線排行榜 ({statsTab === 'monthly' ? '月度' : '年度'})</h3>
                                <button onClick={manualClearStats} className="text-red-400 p-1 hover:text-red-600"><Trash2 className="w-4 h-4"/></button>
                            </div>
                            {((statsTab === 'monthly' ? monthlyKeys : yearlyKeys).length === 0) ? (
                                <div className="p-8 text-center text-gray-400 text-sm">暫無統計數據</div>
                            ) : (
                                <ul className="divide-y divide-gray-100">
                                    {(statsTab === 'monthly' ? monthlyKeys : yearlyKeys).map(key => {
                                        const t = (statsTab === 'monthly' ? safeStatsData.monthly.trips : safeStatsData.yearly.trips)[key];
                                        return (
                                            <li key={key} className="p-4 flex items-center justify-between hover:bg-gray-50">
                                                <div className="flex items-center gap-3">
                                                    <span className={`text-xs w-10 h-6 flex items-center justify-center rounded font-bold ${getCompanyColor(t.company).replace('border', '')}`}>{t.company === 'KMB' ? t.route : (t.company === 'CTB' ? 'CTB' : 'NLB')}</span>
                                                    <div><div className="font-bold text-gray-800 flex items-center gap-2">{t.route} <span className="text-xs font-normal text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded-full">{t.desc}</span></div><div className="text-xs text-gray-400 mt-0.5">{t.company === 'NLB' ? '嶼巴' : t.company}</div></div>
                                                </div>
                                                <div className="font-bold text-xl text-purple-600">{t.count}</div>
                                            </li>
                                        );
                                    })}
                                </ul>
                            )}
                        </div>

                        {/* 詳細乘搭紀錄與刪除功能 */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-4">
                            <div className="p-4 border-b bg-gray-50 flex justify-between items-center">
                                <h3 className="font-bold text-gray-700 flex items-center gap-2"><History className="w-4 h-4 text-blue-500"/> 詳細紀錄與日期</h3>
                            </div>
                            {(!safeStatsData.tripLogs || safeStatsData.tripLogs.length === 0) ? (
                                <div className="p-8 text-center text-gray-400 text-sm">暫無詳細紀錄</div>
                            ) : (
                                <ul className="divide-y divide-gray-100 max-h-[400px] overflow-y-auto">
                                    {safeStatsData.tripLogs.map(log => (
                                        <li key={log.id} className="p-4 flex flex-col gap-1.5 hover:bg-gray-50 relative group">
                                            <button onClick={() => handleDeleteLog(log.id)} className="absolute right-3 top-3 p-1.5 text-gray-300 hover:text-red-500 active:text-red-600 rounded-full bg-white/80 transition-colors z-10 shadow-sm border border-transparent hover:border-red-100">
                                                <Trash2 className="w-4 h-4"/>
                                            </button>
                                            <div className="flex items-center gap-2 pr-8">
                                                <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${getCompanyColor(log.company).replace('border', '')}`}>{log.company === 'NLB' ? '嶼巴' : log.company}</span>
                                                <span className="font-bold text-gray-800 text-lg">{log.route}</span>
                                            </div>
                                            <div className="text-xs text-gray-500 flex items-center justify-between">
                                                <span>{log.desc}</span>
                                                <span className="flex items-center gap-1 bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-medium"><Calendar className="w-3 h-3"/>{log.date}</span>
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // App 2: 客量統計 (輸入介面)
        // ==========================================
        function BusCounterApp({ onBack, onAutoSaveRecord, statsData, setStatsData, busDatabase }) {
            const [company, setCompany] = useState('KMB');
            const [routeNumber, setRouteNumber] = useState('');
            const [currentStopIndex, setCurrentStopIndex] = useState(0); 
            const [tripInfo, setTripInfo] = useState({ plate: '', captainId: '', captainName: '', comment: '' });
            const [activeVariant, setActiveVariant] = useState(null);
            const [tripRecorded, setTripRecorded] = useState(false);
            const [initialPassengers, setInitialPassengers] = useState(0);
            const [totalPassengers, setTotalPassengers] = useState(0);
            const [stopOn, setStopOn] = useState(0);
            const [stopOff, setStopOff] = useState(0);
            const [arrivalTime, setArrivalTime] = useState('');
            const [currentNote, setCurrentNote] = useState('');
            const [showNoteInput, setShowNoteInput] = useState(false);
            const [includeNotesInReport, setIncludeNotesInReport] = useState(true);
            const [includeAnalysis, setIncludeAnalysis] = useState(true);
            const [showTotalPatronage, setShowTotalPatronage] = useState(true); 
            const [history, setHistory] = useState([]);
            const [showReport, setShowReport] = useState(false);
            const [showTripSettings, setShowTripSettings] = useState(false);
            const [showStopSelector, setShowStopSelector] = useState(false);
            
            // 手動修改人數 & Reset State
            const [showManualInput, setShowManualInput] = useState(false);
            const [manualInputMode, setManualInputMode] = useState('base'); 
            const [manualInputValue, setManualInputValue] = useState('');
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            const [copied, setCopied] = useState(false);
            const [durationFormat, setDurationFormat] = useState('min'); 
            const [editingHistoryIndex, setEditingHistoryIndex] = useState(null);
            const [historyEditValues, setHistoryEditValues] = useState({ on: 0, off: 0, note: '', time: '' });
            const [isLoading, setIsLoading] = useState(false);
            const [variants, setVariants] = useState([]); 
            const [showVariantSelector, setShowVariantSelector] = useState(false);
            const [routeStops, setRouteStops] = useState([]); 
            const [apiError, setApiError] = useState(null);
            const [autoSyncRecord, setAutoSyncRecord] = useState(true); 
            const isLoaded = useRef(false);
            
            const [isOcrLoading, setIsOcrLoading] = useState(false);
            const [ocrMessage, setOcrMessage] = useState('');
            const fileInputRef = useRef(null);

            const formatTime24 = (date = new Date()) => date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
            const cleanStopName = (name) => {
                if (!name) return '';
                let cleaned = name.replace(/[\(（]([^\u4e00-\u9fa5]+?)[\)）]/g, '').trim();
                return cleaned.split(/,|，/)[0].trim();
            };
            const calculateDurationMinutes = (startStr, endStr) => {
                if (!startStr || !endStr || startStr === '-' || endStr === '-') return 0;
                const [h1, m1] = startStr.split(':').map(Number);
                const [h2, m2] = endStr.split(':').map(Number);
                let minutes = (h2 * 60 + m2) - (h1 * 60 + m1);
                if (minutes < 0) minutes += 24 * 60; 
                return minutes;
            };

            const companyFleets = useMemo(() => {
                const compData = busDatabase[COMPANY_MAPPING[company] || company];
                if (!compData) return [];
                const fleets = [];
                for (const m in compData) {
                    for (const maj in compData[m]) {
                        for (const min in compData[m][maj]) {
                            fleets.push(...compData[m][maj][min]);
                        }
                    }
                }
                return fleets;
            }, [busDatabase, company]);

            useEffect(() => {
                const savedSession = localStorage.getItem('busCounterCurrentSession');
                if (savedSession) {
                    try {
                        const session = JSON.parse(savedSession);
                        setCompany(session.company || 'KMB'); setRouteNumber(session.routeNumber || ''); setCurrentStopIndex(session.currentStopIndex || 0);
                        setTripInfo(session.tripInfo || { plate: '', captainId: '', captainName: '', comment: '' }); setActiveVariant(session.activeVariant || null);
                        setTripRecorded(session.tripRecorded || false); setInitialPassengers(session.initialPassengers || 0); setTotalPassengers(session.totalPassengers || 0);
                        setStopOn(session.stopOn || 0); setStopOff(session.stopOff || 0); setArrivalTime(session.arrivalTime || '');
                        setHistory(session.history || []); setRouteStops(session.routeStops || []); setCurrentNote(session.currentNote || '');
                        setIncludeNotesInReport(session.includeNotesInReport ?? true); setIncludeAnalysis(session.includeAnalysis ?? true);
                        setShowTotalPatronage(session.showTotalPatronage ?? true);
                        if(session.autoSyncRecord !== undefined) setAutoSyncRecord(session.autoSyncRecord);
                    } catch (e) {}
                }
                isLoaded.current = true;
            }, []);

            useEffect(() => {
                if (!isLoaded.current) return;
                const sessionData = {
                    company, routeNumber, currentStopIndex, tripInfo, activeVariant, tripRecorded, initialPassengers, totalPassengers, stopOn, stopOff, arrivalTime, history, routeStops, currentNote, includeNotesInReport, includeAnalysis, showTotalPatronage, autoSyncRecord
                };
                localStorage.setItem('busCounterCurrentSession', JSON.stringify(sessionData));
            }, [company, routeNumber, currentStopIndex, tripInfo, activeVariant, tripRecorded, initialPassengers, totalPassengers, stopOn, stopOff, arrivalTime, history, routeStops, currentNote, includeNotesInReport, includeAnalysis, showTotalPatronage, autoSyncRecord]);

            const saveTripToStats = () => {
                if (tripRecorded || !activeVariant) return; 
                const newData = { ...statsData };
                if (!newData.yearly) newData.yearly = { trips: {}, total: 0 };
                if (!newData.monthly) newData.monthly = { trips: {}, total: 0 };
                if (!newData.tripLogs) newData.tripLogs = [];

                const key = `${activeVariant.company}-${activeVariant.route}-${activeVariant.description}`;
                if (!newData.yearly.trips[key]) newData.yearly.trips[key] = { company: activeVariant.company, route: activeVariant.route, desc: activeVariant.description, count: 0 };
                newData.yearly.trips[key].count += 1; newData.yearly.total += 1;
                if (!newData.monthly.trips[key]) newData.monthly.trips[key] = { company: activeVariant.company, route: activeVariant.route, desc: activeVariant.description, count: 0 };
                newData.monthly.trips[key].count += 1; newData.monthly.total += 1;

                newData.tripLogs.unshift({
                    id: Date.now().toString(),
                    date: new Date().toISOString().split('T')[0],
                    company: activeVariant.company,
                    route: activeVariant.route,
                    desc: activeVariant.description
                });

                newData.lastSaveTime = Date.now();
                setStatsData(newData); localStorage.setItem('busCounterStats', JSON.stringify(newData)); setTripRecorded(true); 
            };

            const recalculateAll = (baseCount, currentHistory = history, currentOn = stopOn, currentOff = stopOff) => {
                let runningTotal = baseCount;
                const newHistory = currentHistory.map(record => {
                    if (record.isSeparator) return record;
                    runningTotal = runningTotal + record.on - record.off;
                    return { ...record, occupancy: runningTotal };
                });
                setHistory(newHistory); setInitialPassengers(baseCount);
                setTotalPassengers(runningTotal + currentOn - currentOff);
            };

            const getAnalysisData = () => {
                let combinedData = history.filter(r => !r.isSeparator);
                if (routeStops.length > 0 && currentStopIndex < routeStops.length) {
                     if (stopOn > 0 || stopOff > 0 || arrivalTime || currentNote) {
                         combinedData = [...combinedData, { stopName: routeStops[currentStopIndex].name, on: stopOn, off: stopOff, occupancy: totalPassengers, note: currentNote, isLive: true }];
                     }
                }
                if (combinedData.length === 0) return null;
                let maxOnVal = 0, maxOccVal = 0, maxOffVal = 0; 
                combinedData.forEach(r => {
                    if (r.on > maxOnVal) maxOnVal = r.on; if (r.occupancy > maxOccVal) maxOccVal = r.occupancy; if (r.off > maxOffVal) maxOffVal = r.off;
                });
                const maxOnStops = combinedData.filter(r => r.on === maxOnVal && maxOnVal > 0);
                const maxOffStops = combinedData.filter(r => r.off === maxOffVal && maxOffVal > 0);
                const rawSegments = [];
                combinedData.forEach((r, idx) => {
                    if (r.occupancy === maxOccVal && maxOccVal > 0) {
                        let toStopName = null;
                        if (idx + 1 < combinedData.length) toStopName = cleanStopName(combinedData[idx + 1].stopName);
                        else if (r.isLive && currentStopIndex + 1 < routeStops.length) toStopName = routeStops[currentStopIndex + 1].name;
                        else toStopName = "報告完結";
                        rawSegments.push({ from: cleanStopName(r.stopName), to: toStopName, val: r.occupancy });
                    }
                });
                const mergedSegments = [];
                if (rawSegments.length > 0) {
                    let currentSeg = { ...rawSegments[0] };
                    for (let i = 1; i < rawSegments.length; i++) {
                        if (currentSeg.to === rawSegments[i].from && currentSeg.to !== "報告完結") currentSeg.to = rawSegments[i].to; 
                        else { mergedSegments.push(currentSeg); currentSeg = { ...rawSegments[i] }; }
                    }
                    mergedSegments.push(currentSeg);
                }
                const formattedSegments = mergedSegments.map(seg => seg.to === "報告完結" || seg.to === null ? `${seg.from} (報告完結站)` : `${seg.from} - ${seg.to} 段`);
                return { maxOnVal, maxOccVal, maxOffVal, maxOnStops, maxOffStops, formattedSegments };
            };

            const getCompanyColor = (comp) => comp === 'KMB' ? 'bg-red-600 border-red-700 text-white' : comp === 'CTB' ? 'bg-yellow-400 border-yellow-500 text-black' : comp === 'NLB' ? 'bg-teal-600 border-teal-700 text-white' : 'bg-gray-400 border-gray-500 text-white';
            const toggleCompany = () => setCompany(prev => prev === 'KMB' ? 'CTB' : prev === 'CTB' ? 'NLB' : 'KMB');

            const searchRoute = async () => {
                if (!routeNumber) return;
                setIsLoading(true); setApiError(null); setVariants([]); setShowVariantSelector(false); setActiveVariant(null); 
                try {
                    if (company === 'KMB') {
                        const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/`);
                        const data = await response.json();
                        if (data.data) {
                            const filteredRoutes = data.data.filter(r => r.route.toUpperCase() === routeNumber.toUpperCase());
                            if (filteredRoutes.length > 0) {
                                const routeVariants = filteredRoutes.map(r => ({ company: 'KMB', route: r.route, bound: r.bound, serviceType: r.service_type, orig: r.orig_tc, dest: r.dest_tc, description: `往 ${r.dest_tc}`, subDescription: `由 ${r.orig_tc} 開出`, tag: r.service_type === '1' ? '日常班次' : `特別班次 (${r.service_type})` }));
                                routeVariants.sort((a, b) => a.serviceType - b.serviceType); setVariants(routeVariants); setShowVariantSelector(true);
                            } else setApiError(`找不到路線 ${routeNumber}`);
                        } else setApiError("API 連線錯誤");
                    } else if (company === 'CTB') {
                        const response = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route/CTB/${routeNumber.toUpperCase()}`);
                        const data = await response.json();
                        if (data.data) {
                            const r = Array.isArray(data.data) ? data.data : [data.data];
                            let ctbVariants = [];
                            r.forEach(routeObj => {
                                ctbVariants.push({ company: 'CTB', route: routeObj.route, dir: 'outbound', orig: routeObj.orig_tc, dest: routeObj.dest_tc, description: `往 ${routeObj.dest_tc} (去程)`, subDescription: `由 ${routeObj.orig_tc} 開出`, tag: '去程' });
                                ctbVariants.push({ company: 'CTB', route: routeObj.route, dir: 'inbound', orig: routeObj.dest_tc, dest: routeObj.orig_tc, description: `往 ${routeObj.orig_tc} (回程)`, subDescription: `由 ${routeObj.dest_tc} 開出`, tag: '回程' });
                            });
                            setVariants(ctbVariants); setShowVariantSelector(true);
